<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruits Slash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen, phone-first arcade: header, level strip, play board, footer. Single dark look by choice. */
:root {
  --bg: #0d1830;
  --panel: #17264c;
  --ink: #f6f0e4;
  --muted: #8fa0c4;
  --gold: #f5a524;
  --gold-ink: #2a1600;
  --red: #ef4a4a;
  --track: rgba(255,255,255,.14);
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 12px; box-sizing: border-box;
}
header { display: flex; align-items: center; gap: 10px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; letter-spacing: .4px; flex: 1; line-height: 1; }
h1 span { color: var(--gold); }
.score {
  font-family: var(--display); font-size: 16px; color: var(--gold);
  background: rgba(245,165,36,.14); padding: 7px 12px; border-radius: 999px;
  min-width: 64px; text-align: center; font-variant-numeric: tabular-nums;
}
.score.pop { animation: pop .25s ease-out; }
@keyframes pop { 40% { transform: scale(1.18); } }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: rgba(255,255,255,.08); color: var(--ink); cursor: pointer; padding: 0;
}
.icon-btn:focus-visible, .play:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn .off { display: none; }
.icon-btn.muted .on { display: none; }
.icon-btn.muted .off { display: block; }

.strip { display: flex; align-items: center; gap: 10px; }
.segs { display: flex; gap: 2px; }
.seg { width: 11px; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.seg i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
.lvl { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strikes { display: flex; gap: 4px; }
.strikes svg { width: 16px; height: 16px; stroke: var(--muted); opacity: .6; transition: transform .2s; }
.strikes svg.on { stroke: var(--red); opacity: 1; transform: scale(1.15); }

.board {
  position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden;
  background: #7a4a1f; box-shadow: 0 12px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
footer { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 20px;
  background: rgba(8,14,30,.5); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
.card {
  background: var(--panel); border-radius: 20px; padding: 24px 22px; width: 100%; max-width: 320px; box-sizing: border-box;
  box-shadow: 0 24px 60px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 14px; text-align: center;
}
.eyebrow { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; margin: 0; color: var(--gold); text-wrap: balance; }
.card p { margin: 0; color: var(--ink); opacity: .85; font-size: 14px; line-height: 1.45; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 14px; }
.rules li { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.05); padding: 9px 12px; border-radius: 12px; }
.rules .dot { width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; }
.rules b { font-weight: 800; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats div { background: rgba(255,255,255,.05); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.stats span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stats b { font-family: var(--display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
.best { font-size: 13px !important; color: var(--muted) !important; opacity: 1 !important; }
.play {
  font-family: var(--display); font-size: 20px; letter-spacing: .3px;
  background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 999px; padding: 13px 20px; cursor: pointer;
  box-shadow: 0 4px 0 #b06d0b;
}
.play:active { transform: translateY(2px); box-shadow: 0 2px 0 #b06d0b; }
@media (prefers-reduced-motion: reduce) { .score.pop { animation: none; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Fruits <span>Slash</span></h1>
    <button class="icon-btn" id="soundBtn" aria-label="Sound on" title="Sound">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
    <div class="score" id="score">0 pts</div>
  </header>

  <div class="strip">
    <div class="segs" id="segs"></div>
    <div class="lvl" id="lvl">Morning market</div>
    <div class="strikes" id="strikes"></div>
  </div>

  <div class="board" id="board">
    <canvas id="cv"></canvas>

    <div class="overlay" id="startOv">
      <div class="card">
        <p class="eyebrow" id="startEyebrow">Twelve stalls · one blade</p>
        <h2>Fruits Slash</h2>
        <ul class="rules">
          <li><span class="dot" style="background:radial-gradient(circle at 35% 35%,#ff6b6b,#c62833)"></span><span><b>Swipe</b> through fruit to slice it</span></li>
          <li><span class="dot" style="background:radial-gradient(circle at 35% 35%,#55555f,#09090d)"></span><span><b>Avoid bombs.</b> One hit closes the market</span></li>
          <li><span class="dot" style="background:radial-gradient(circle at 35% 35%,#ffd36b,#e07b1f)"></span><span><b>Drop 2 fruits</b> and you're out</span></li>
        </ul>
        <button class="play" id="playBtn">Start slicing</button>
      </div>
    </div>

    <div class="overlay" id="overOv" hidden>
      <div class="card">
        <p class="eyebrow" id="overEyebrow">Game over</p>
        <h2 id="overTitle">Market closed</h2>
        <p id="overReason">You hit a bomb.</p>
        <div class="stats">
          <div><span>Score</span><b id="overScore">0</b></div>
          <div><span>Stall</span><b id="overLevel">1/5</b></div>
        </div>
        <p class="best" id="overBest"></p>
        <button class="play" id="againBtn">Play again</button>
      </div>
    </div>
  </div>

  <footer>
    <span id="bestLine">Best: 0 pts · stall 1</span>
    <span>Swipe fast to slice</span>
  </footer>
</div>

<script src="/games/gh-guard.js"></script>
<script>
(() => {

/* ---------- config ---------- */

  { name: 'Spice lane',     goal: 34, gap: .85,  max: 5, bomb: .24 },
  { name: 'Festival rush',  goal: 36, gap: .8,   max: 6, bomb: .25 },
  { name: 'Midnight bazaar', goal: 40, gap: .75, max: 6, bomb: .26 },
  { name: 'Lantern street', goal: 42, gap: .7,   max: 6, bomb: .27 },
  { name: 'Grand finale',   goal: 46, gap: .65,  max: 6, bomb: .28 },
];
const lv = () => LEVELS[Math.min(state.level, LEVELS.length - 1)];

  { top: '#8ccbef', bot: '#f6dfae', dim: 0,   lit: false, sun: '255,244,201' },
  { top: '#4fa8e6', bot: '#c4e6f7', dim: 0,   lit: false, sun: '255,255,255' },
  { top: '#e9974a', bot: '#f6d38e', dim: .06, lit: false, sun: '255,232,163' },
  { top: '#4f3a78', bot: '#e6845a', dim: .3,  lit: true,  sun: '255,179,107' },
  { top: '#0e1433', bot: '#2c2a5a', dim: .5,  lit: true,  moon: true },

/* ---------- utils ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function ell(c, rx, ry, cx = 0, cy = 0) { c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function shine(c, rx, ry, cy = 0) { c.beginPath(); c.ellipse(-rx * .36, cy - ry * .42, rx * .26, ry * .14, -.6, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.25)'; c.fill(); }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));

/* ---------- fruit art (drawn once into sprites) ---------- */
const FR = {
  watermelon: { r: 1.05, w: 1, juice: '#d9303e',
    whole(c, r) {
      const ry = r * .86; ell(c, r, ry);
      const g = c.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r); g.addColorStop(0, '#62c25e'); g.addColorStop(1, '#1b6428');
      c.fillStyle = g; c.fill();
      c.save(); ell(c, r, ry); c.clip(); c.strokeStyle = 'rgba(16,64,26,.85)'; c.lineWidth = r * .13; c.lineCap = 'round';
      for (let i = -3; i <= 3; i++) { c.beginPath(); for (let k = 0; k <= 20; k++) { const t = -1 + k / 10, y = t * ry, x = i * r * .3 + Math.sin(t * 6 + i) * r * .05; k ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); }
      c.restore(); shine(c, r, ry);
    },
    cut(c, r) {
      const ry = r * .86; ell(c, r, ry); c.fillStyle = '#1b6428'; c.fill();
      ell(c, r * .92, ry * .92); c.fillStyle = '#e9f3c4'; c.fill();
      ell(c, r * .83, ry * .83); const g = c.createRadialGradient(0, 0, r * .1, 0, 0, r * .85); g.addColorStop(0, '#ff7676'); g.addColorStop(1, '#d42c3a'); c.fillStyle = g; c.fill();
      c.fillStyle = '#1a1210';
      for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + .26, d = i % 2 ? .45 : .6; c.save(); c.translate(Math.cos(a) * r * d, Math.sin(a) * ry * d); c.rotate(a + Math.PI / 2); ell(c, r * .045, r * .085); c.fill(); c.restore(); }
    } },
  papaya: { r: .95, w: 1.2, juice: '#f0782a',
    whole(c, r) {
      const rx = r * .72, ry = r; ell(c, rx, ry);
      const g = c.createLinearGradient(0, -ry, 0, ry); g.addColorStop(0, '#9cbf4a'); g.addColorStop(.35, '#f2b33a'); g.addColorStop(1, '#e2701c');
      c.fillStyle = g; c.fill(); shine(c, rx, ry);
      c.fillStyle = '#5a7a2a'; ell(c, r * .09, r * .06, 0, -ry); c.fill();
    },
    cut(c, r) {
      const rx = r * .72, ry = r; ell(c, rx, ry); c.fillStyle = '#86a83c'; c.fill();

      for (let i = 1; i <= 18; i++) { const a = i * 2.4, d = Math.sqrt(i / 18) * .85; const x = Math.cos(a) * rx * .3 * d, y = Math.sin(a) * ry * .47 * d;

    } },
  pineapple: { r: .95, w: 1, juice: '#f2c43a',
    whole(c, r) {

      for (let i = -2; i <= 2; i++) { const h = r * (.62 - Math.abs(i) * .12), bx = i * r * .1, tx = i * r * .26;
        c.beginPath(); c.moveTo(bx - r * .1, cy - ry * .85); c.quadraticCurveTo(tx - r * .05, cy - ry - h * .5, tx, cy - ry - h); c.quadraticCurveTo(tx + r * .06, cy - ry - h * .4, bx + r * .1, cy - ry * .85); c.closePath();

      ell(c, rx, ry, 0, cy);
      const g = c.createRadialGradient(-rx * .3, cy - ry * .3, r * .1, 0, cy, r); g.addColorStop(0, '#f9d561'); g.addColorStop(1, '#b06d18');
      c.fillStyle = g; c.fill();
      c.save(); ell(c, rx, ry, 0, cy); c.clip(); c.strokeStyle = 'rgba(105,58,10,.7)'; c.lineWidth = r * .045; const s = r * .3;
      for (let k = -8; k <= 8; k++) { c.beginPath(); c.moveTo(k * s - 2 * r, -2 * r); c.lineTo(k * s + 2 * r, 2 * r); c.stroke(); c.beginPath(); c.moveTo(k * s + 2 * r, -2 * r); c.lineTo(k * s - 2 * r, 2 * r); c.stroke(); }
      c.restore(); shine(c, rx, ry, cy);
    },
    cut(c, r) {
      const rx = r * .74, ry = r * .9; ell(c, rx, ry); c.fillStyle = '#a8681e'; c.fill();
      ell(c, rx * .88, ry * .9); const g = c.createRadialGradient(0, 0, r * .1, 0, 0, r); g.addColorStop(0, '#fff2a6'); g.addColorStop(1, '#f2c232'); c.fillStyle = g; c.fill();
      c.strokeStyle = 'rgba(214,150,30,.35)'; c.lineWidth = 1.2;
      for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * rx * .25, Math.sin(a) * ry * .28); c.lineTo(Math.cos(a) * rx * .82, Math.sin(a) * ry * .84); c.stroke(); }

  orange: { r: .78, w: 1.2, juice: '#ff9a1f',
    whole(c, r) {

    whole(c, r) {
      c.save(); c.rotate(-.35); const rx = r * .8, ry = r; ell(c, rx, ry);
      const g = c.createLinearGradient(-rx, -ry, rx, ry); g.addColorStop(0, '#d8432c'); g.addColorStop(.45, '#f2a43a'); g.addColorStop(.7, '#f6cf4a'); g.addColorStop(1, '#86b33d');
      c.fillStyle = g; c.fill(); shine(c, rx, ry); c.restore();
    },
    cut(c, r) {
      const rx = r * .8, ry = r; ell(c, rx, ry); c.fillStyle = '#d9832a'; c.fill();
      ell(c, rx * .93, ry * .95); const g = c.createRadialGradient(0, 0, r * .1, 0, 0, r); g.addColorStop(0, '#ffd85a'); g.addColorStop(1, '#ffab1c'); c.fillStyle = g; c.fill();

      c.strokeStyle = 'rgba(190,150,80,.55)'; c.lineWidth = 1;
      for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(i * rx * .08, -ry * .58); c.quadraticCurveTo(i * rx * .14, 0, i * rx * .08, ry * .58); c.stroke(); }
    } },
  coconut: { r: .82, w: .8, juice: '#f4f1e8',
    whole(c, r) {
      circ(c, 0, 0, r); const g = c.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r); g.addColorStop(0, '#91603a'); g.addColorStop(1, '#45290f'); c.fillStyle = g; c.fill();
      const R = mulberry32(9); c.strokeStyle = 'rgba(176,130,80,.55)'; c.lineWidth = 1.2;
      for (let i = 0; i < 60; i++) { const a = R() * 6.283, d = R() * r * .9, x = Math.cos(a) * d, y = Math.sin(a) * d, b = R() * 6.283, l = r * .14;
        c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(b) * l, y + Math.sin(b) * l); c.stroke(); }
      c.fillStyle = '#24140a'; [[-.2, -.5], [.2, -.5], [0, -.28]].forEach(([x, y]) => { circ(c, x * r, y * r, r * .09); c.fill(); });
    },
    cut(c, r) {
      circ(c, 0, 0, r); c.fillStyle = '#4a2c14'; c.fill();
      circ(c, 0, 0, r * .86); c.fillStyle = '#f8f4ea'; c.fill();
      circ(c, 0, 0, r * .64); const g = c.createRadialGradient(0, 0, 0, 0, 0, r * .64); g.addColorStop(0, '#f2f6f6'); g.addColorStop(1, '#d4e0e2'); c.fillStyle = g; c.fill();
    } },
};
const FRUIT_KEYS = Object.keys(FR);
const FRUIT_W = FRUIT_KEYS.reduce((s, k) => s + FR[k].w, 0);
function pickFruit() { let t = Math.random() * FRUIT_W; for (const k of FRUIT_KEYS) { t -= FR[k].w; if (t <= 0) return k; } return FRUIT_KEYS[0]; }

let sprites = {};
function sprite(key, kind) {
  const id = key + kind; if (sprites[id]) return sprites[id];

  const nx = Math.sin(a), ny = -Math.cos(a), push = U * 2.4;
  for (const side of [0, 1]) { const s = side ? -1 : 1;
    pieces.push({ key: f.key, side, x: f.x, y: f.y, vx: f.vx * .5 + nx * push * s, vy: f.vy * .4 + ny * push * s - U * 1.2, rot: a, vr: f.vr * .5 + s * rand(1.5, 3) }); }
  const col = FR[f.key].juice;
  for (let i = 0; i < 14; i++) { const b = rand(0, 6.28), sp = rand(U * 1, U * 5);
    parts.push({ x: f.x, y: f.y, vx: Math.cos(b) * sp + Math.cos(a) * U * 2, vy: Math.sin(b) * sp + Math.sin(a) * U * 2, life: rand(.35, .7), max: .7, color: col, size: rand(1.5, 4), g: .7 }); }
  if (f.y > BAND + f.r * .3) addSplat(f.x, f.y, f.r, col);
  state.score += 10; state.sliced++;
  if (time - combo.last < .25) combo.n++; else combo.n = 1;
  combo.last = time; combo.x = f.x; combo.y = f.y;
  sfxSlice(); hud();
  if (state.mode === 'play' && state.sliced >= lv().goal) levelClear();
}
function addSplat(x, y, r, color) {
  const blobs = []; for (let i = 0; i < 6; i++) { const a = rand(0, 6.28), d = rand(.2, 1.1) * r; blobs.push({ dx: Math.cos(a) * d, dy: Math.sin(a) * d * .7, r: rand(.12, .32) * r }); }
  splats.push({ x, y, r: r * rand(.55, .8), color, life: 4, blobs });
  if (splats.length > 24) splats.shift();
}
function explode(f) {
  state.mode = 'dying'; state.reason = 'bomb'; state.endAt = time + 1.2; flash = 1; shake = .6; pending = [];
  for (let i = 0; i < 46; i++) { const b = rand(0, 6.28), sp = rand(U * 2, U * 12);
    parts.push({ x: f.x, y: f.y, vx: Math.cos(b) * sp, vy: Math.sin(b) * sp, life: rand(.4, 1), max: 1, color: ['#ffd166', '#ff7b2e', '#ff3d2e', '#555'][i % 4], size: rand(2, 6), g: .3 }); }
  addText('BOOM!', f.x, f.y, '#ff6b4a', U * .8, 1.2);
  sfxBomb();
}
function miss(x) {
  state.strikes++; shake = Math.max(shake, .18);
  addText('Missed!', clamp(x, U * 1.5, W - U * 1.5), H - U * 1.1, '#ff8a8a', U * .48, 1.1);
  sfxMiss(); hud();
  if (state.strikes >= 2) { state.mode = 'dying'; state.reason = 'drop'; state.endAt = time + 1; pending = []; }
}
function addText(text, x, y, color, size, life) { texts.push({ text, x, y, color, size, life, max: life }); }

/* ---------- input ---------- */
let down = false, lastPt = null;
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
const live = () => state.mode === 'play' || state.mode === 'clearing';
cv.addEventListener('pointerdown', e => {
  if (!live()) return; ensureAudio(); down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  lastPt = pos(e); trail.push({ ...lastPt, t: time }); e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (!down || !live()) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) { const p = pos(ev); if (live()) trySlice(lastPt.x, lastPt.y, p.x, p.y); trail.push({ ...p, t: time }); lastPt = p; }
});
const up = () => { down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
$('#playBtn').addEventListener('click', startGame);
$('#againBtn').addEventListener('click', () => { if (HUB) hubSend({ type: hub.won ? 'gh-open-claim' : 'gh-open-buy' }); else startGame(); });
if (HUB) { hubEyebrow(); setTimeout(() => hubSend({ type: 'gh-ready' }), 0); }

/* ---------- update ---------- */
function update(dt) {
  time += dt; const G = gravity();
  if (shake > 0) shake -= dt; if (flash > 0) flash -= dt * 1.6;

  if ((state.mode === 'menu' || state.mode === 'over') && time > state.ambientAt) { spawnOne({ ambient: true }); state.ambientAt = time + rand(.9, 1.5); }
  if (state.mode === 'play') {
    if (time >= state.spawnAt) { spawnWave(); const L = lv(); state.spawnAt = time + L.gap * rand(.85, 1.15); }
    for (let i = pending.length - 1; i >= 0; i--) if (time >= pending[i].at) { spawnOne(pending[i]); pending.splice(i, 1); }
  }
  if (state.banner) { state.banner.t += dt; if (state.banner.t > state.banner.dur) state.banner = null; }
  if (state.mode === 'clearing' && time > state.endAt) { if (HUB) hubAdvance(); else if (state.level >= LEVELS.length - 1) endGame(true); else { state.level++; startLevel(); } }
  if (state.mode === 'dying' && time > state.endAt) endGame(false);

  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i]; f.vy += G * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
    if (f.bomb && Math.random() < dt * 30) { const c = Math.cos(f.rot), s = Math.sin(f.rot), lx = f.r * .45, ly = -f.r * 1.35;
      parts.push({ x: f.x + lx * c - ly * s, y: f.y + lx * s + ly * c, vx: rand(-40, 40), vy: rand(-60, 0), life: .3, max: .3, color: '#ffd166', size: rand(1, 2.4), g: .2 }); }
    if (f.vy > 0 && f.y > H + f.r * 1.6) { fruits.splice(i, 1); if (!f.bomb && !f.safe && state.mode === 'play') miss(f.x); }
  }
  for (let i = pieces.length - 1; i >= 0; i--) { const p = pieces[i]; p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; if (p.y > H + U * 3) pieces.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.vy += G * p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }
  for (let i = splats.length - 1; i >= 0; i--) { splats[i].life -= dt; if (splats[i].life <= 0) splats.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt; t.y -= U * .35 * dt; if (t.life <= 0) texts.splice(i, 1); }
  while (trail.length && time - trail[0].t > .13) trail.shift();
  if (!down && trail.length && time - trail[trail.length - 1].t > .05) trail.length = 0;

  if (combo.n && time - combo.last > .25) {
    if (combo.n >= 3 && live()) { const bonus = combo.n * 10; state.score += bonus;
      addText(combo.n + ' fruit combo', clamp(combo.x, U * 2.5, W - U * 2.5), combo.y - U * .4, '#ffd166', U * .45, 1.2);
      addText('+' + bonus, clamp(combo.x, U * 2.5, W - U * 2.5), combo.y + U * .2, '#fff', U * .4, 1.2); sfxCombo(); hud(); }
    combo.n = 0;
  }
}

/* ---------- render ---------- */
function drawBomb(f) {
  const r = f.r; ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
  circ(ctx, 0, 0, r * 1.3); ctx.fillStyle = `rgba(255,60,40,${.12 + .08 * Math.sin(time * 12)})`; ctx.fill();
  circ(ctx, 0, 0, r); const g = ctx.createRadialGradient(-r * .35, -r * .35, r * .05, 0, 0, r); g.addColorStop(0, '#5a5a68'); g.addColorStop(1, '#08080c'); ctx.fillStyle = g; ctx.fill();
  shine(ctx, r, r);
  ctx.fillStyle = '#6b6b78'; ctx.fillRect(-r * .22, -r * 1.1, r * .44, r * .22);
  ctx.strokeStyle = '#c9a063'; ctx.lineWidth = r * .1; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -r * 1.05); ctx.quadraticCurveTo(r * .2, -r * 1.5, r * .45, -r * 1.35); ctx.stroke();
  const sr = r * .32 * (.8 + Math.random() * .4); const sg = ctx.createRadialGradient(r * .45, -r * 1.35, 0, r * .45, -r * 1.35, sr);
  sg.addColorStop(0, 'rgba(255,255,220,1)'); sg.addColorStop(.4, 'rgba(255,200,60,.9)'); sg.addColorStop(1, 'rgba(255,120,0,0)');
  ctx.fillStyle = sg; circ(ctx, r * .45, -r * 1.35, sr); ctx.fill();
  ctx.restore();
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0 && !reduceMotion) { const m = U * .25 * Math.min(1, shake * 2); ctx.translate(rand(-m, m), rand(-m, m)); }
  buildBg(); ctx.drawImage(bgCanvas, -2, -2, W + 4, H + 4);

  for (const s of splats) { ctx.globalAlpha = Math.min(1, s.life / 1.5) * .5; ctx.fillStyle = s.color;
    ell(ctx, s.r, s.r * .7, s.x, s.y); ctx.fill(); for (const b of s.blobs) { circ(ctx, s.x + b.dx, s.y + b.dy, b.r); ctx.fill(); } }
  ctx.globalAlpha = 1;

  for (const p of pieces) { const s = sprite(p.key, 'cut'); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.beginPath(); ctx.rect(-s.size / 2, p.side ? 0 : -s.size / 2, s.size, s.size / 2); ctx.clip();
    ctx.drawImage(s.cnv, -s.size / 2, -s.size / 2, s.size, s.size); ctx.restore(); }

  for (const f of fruits) {
    if (f.ambient) ctx.globalAlpha = .9;
    if (f.bomb) drawBomb(f);
    else { const s = sprite(f.key, 'whole'); ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.drawImage(s.cnv, -s.size / 2, -s.size / 2, s.size, s.size); ctx.restore(); }
    ctx.globalAlpha = 1;
  }

  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color; circ(ctx, p.x, p.y, p.size); ctx.fill(); }
  ctx.globalAlpha = 1;

  if (trail.length > 1) {
    ctx.lineCap = 'round'; const n = trail.length;
    for (let pass = 0; pass < 2; pass++) for (let i = 1; i < n; i++) { const k = i / n;
      ctx.strokeStyle = pass ? `rgba(255,255,255,${.95 * k})` : `rgba(150,215,255,${.3 * k})`;
      ctx.lineWidth = (pass ? 1 : 2.4) * (k * U * .22 + 1);
      ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke(); }
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    const age = t.max - t.life, sc = age < .15 ? .6 + age / .15 * .4 : 1;
    ctx.globalAlpha = Math.min(1, t.life / .4); ctx.font = `${Math.round(t.size * sc)}px "Lilita One", "Arial Rounded MT Bold", sans-serif`;
    ctx.lineWidth = Math.max(3, t.size * .14); ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(50,22,0,.75)';
    ctx.strokeText(t.text, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  if (state.banner) {
    const b = state.banner, a = Math.min(1, b.t / .25, (b.dur - b.t) / .35);
    const fs = Math.max(12, Math.round(U * .3)), y = BAND + (H - BAND) * .16;
    ctx.font = `${fs}px "Lilita One", "Arial Rounded MT Bold", sans-serif`;
    const tag = 'LEVEL ' + (state.level + 1), name = lv().name;
    const tw = ctx.measureText(tag).width, nw = ctx.measureText(name).width, pad = fs * .6, h = fs * 2;
    const w = tw + nw + pad * 4.2, x = W / 2 - w / 2;
    ctx.globalAlpha = Math.max(0, a);
    rrect(ctx, x, y - h / 2, w, h, h / 2); ctx.fillStyle = 'rgba(14,20,40,.88)'; ctx.fill();
    rrect(ctx, x + fs * .25, y - h / 2 + fs * .25, tw + pad * 2, h - fs * .5, (h - fs * .5) / 2); ctx.fillStyle = '#f5a524'; ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = '#2a1600'; ctx.fillText(tag, x + fs * .25 + pad, y + 1);
    ctx.fillStyle = '#fff'; ctx.fillText(name, x + fs * .25 + tw + pad * 3, y + 1);
    ctx.globalAlpha = 1; ctx.textAlign = 'center';
  }

  if (flash > 0) { ctx.fillStyle = `rgba(255,236,200,${Math.max(0, flash) * .85})`; ctx.fillRect(-10, -10, W + 20, H + 20); }
}

let last = performance.now();
function frame(now) { const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now; update(dt); render(); requestAnimationFrame(frame); }
hud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
