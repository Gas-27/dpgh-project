<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nail Hit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
/* Layout: one full-bleed canvas; the spinning log sits in the upper third, the nail waits below. Single dark workshop look by choice. */
:root{
  --night:#1b2440; --dusk:#3a2a52; --oak:#e9a35a; --bark:#5a2c0e; --steel:#dfe3ec; --ink:#2c3044;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#probe{position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
</head>
<body>
<canvas id="c" aria-label="Nail Hit game. Tap or press space to throw a nail."></canvas>
<div id="probe"></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),probe=document.getElementById('probe');
const FONT='"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif';
const TAU=Math.PI*2, wrap=a=>((a+Math.PI)%TAU+TAU)%TAU-Math.PI;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR,cx,cy,R,L,D,HW,HT,SW,safeT=0,safeB=0;
let LR, wood=null, golden=false;

// ---------- state ----------
let mode='ready', score=0, best=0, stage=1, stageHits=0, target=7, pattern=0, won=false;
const MAX_STAGE=12;
let rot=0, stageT=0, nails=[], flying=null, reload=0, debris=[], dust=[];
let logPop=1, kick=0, shake=0, flash=0, overT=0, failT=0, clearT=0, newBest=false;
try{best=+localStorage.getItem('nailhit-best')||0}catch(e){}

// Game Hub bridge: stages, lives and rewards are decided by the server, not this page
const HUB=new URLSearchParams(location.search).get('hub')==='1'&&window.parent!==window;
const hub={ready:false,level:1,lives:2,status:'active',target:12,rewardGb:25,pending:null};
const lastStage=()=>HUB?hub.target:MAX_STAGE;
function hubSend(m){try{window.parent.postMessage(Object.assign({source:'gamehub'},m),location.origin)}catch(e){}}
if(HUB)addEventListener('message',e=>{
  if(e.source!==window.parent||e.origin!==location.origin)return;
  const d=e.data;if(!d||d.source!=='gamehub-parent')return;
  if(d.type==='gh-state'){
    hub.ready=true;hub.level=d.level;hub.lives=d.lives;hub.status=d.status;if(d.target)hub.target=d.target;if(d.rewardGb)hub.rewardGb=d.rewardGb;
    if(mode==='ready'||mode==='over'){
      if(hub.status==='cleared'){won=true;mode='over';overT=0;hubSend({type:'gh-open-claim'})}
      else if(hub.lives<=0){mode='over';overT=0;hubSend({type:'gh-open-buy'})}
    }
  }
  else if(d.type==='gh-level-result'&&hub.pending){const p=hub.pending;hub.pending=null;p(d)}
  else if(d.type==='gh-continue'){hub.lives=Math.max(1,d.lives||1);won=false;mode='play';newStage(stage)}
});
function hubAdvance(){
  mode='sync';
  new Promise(r=>{hub.pending=r;hubSend({type:'gh-level-complete',level:stage})}).then(d=>{
    if(!d.ok){const next=d.level>0?d.level:stage;if(d.lives!=null)hub.lives=d.lives;hub.level=next;hubNote=d.message||'That stage could not be verified. Play it again.';hubNoteT=3;mode='play';newStage(next);return}
    hub.level=d.level;hub.lives=d.lives;hub.status=d.status;
    if(d.status==='cleared'){won=true;mode='over';overT=0;logPop=0;hubSend({type:'gh-open-claim'});return}
    mode='play';newStage(stage+1);
  });
}
let hubNote='',hubNoteT=0;

function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  const cs=getComputedStyle(probe);safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0;
  R=Math.max(60,Math.min(W*.36,H*.17));
  L=R*.62;D=R*.12;HW=R*.2;HT=R*.06;SW=R*.07;
  LR=R*(golden?.76:.72);cx=W/2;cy=safeT+18+R*.7+LR;
  buildWood();
  if(!dust.length)for(let i=0;i<40;i++)dust.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,s:Math.random()*.02+.005});
}

// ---------- wood face ----------
function buildWood(){
  const S=Math.ceil(LR*2*DPR)+6, o=document.createElement('canvas');o.width=o.height=S;
  const g=o.getContext('2d');g.scale(DPR,DPR);const c=S/DPR/2;
  g.save();g.beginPath();g.arc(c,c,LR,0,TAU);g.clip();
  const rg=g.createRadialGradient(c-LR*.2,c-LR*.25,LR*.1,c,c,LR);
  if(golden){rg.addColorStop(0,'#fff0a8');rg.addColorStop(1,'#e2a52a')}else{rg.addColorStop(0,'#f6c07a');rg.addColorStop(1,'#d9853c')}
  g.fillStyle=rg;g.fillRect(0,0,S,S);
  // diagonal grain streaks
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  g.lineCap='round';
  for(let i=0;i<26;i++){
    const off=(rnd()-.5)*LR*2.4;g.beginPath();
    for(let t=-1.2;t<=1.2;t+=.1){const x=c+t*LR+off*.5,y=c-t*LR*.9+off+Math.sin(t*3+i)*LR*.05;t===-1.2?g.moveTo(x,y):g.lineTo(x,y)}
    g.strokeStyle=i%3?(golden?'rgba(255,250,220,.28)':'rgba(255,225,180,.22)'):(golden?'rgba(150,95,0,.22)':'rgba(130,60,15,.2)');
    g.lineWidth=rnd()*LR*.05+1;g.stroke();
  }
  // growth rings
  for(let i=1;i<=5;i++){
    const r=LR*i/5.6,ph=rnd()*TAU;g.beginPath();
    for(let k=0;k<=60;k++){const a=k/60*TAU,rr=r*(1+.035*Math.sin(a*3+ph)+.02*Math.sin(a*5));const x=c+Math.cos(a)*rr,y=c+Math.sin(a)*rr;k?g.lineTo(x,y):g.moveTo(x,y)}
    g.strokeStyle=golden?'rgba(150,95,0,.32)':'rgba(125,58,14,.3)';g.lineWidth=1.6;g.stroke();
  }
  g.restore();
  g.beginPath();g.arc(c,c,LR-1.5,0,TAU);g.strokeStyle=golden?'#7a4c00':'#5a2c0e';g.lineWidth=3;g.stroke();
  g.beginPath();g.arc(c,c,LR*.9,0,TAU);g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=LR*.05;g.stroke();
  wood=o;
}

// ---------- spin patterns ----------
function speed(t){
  const b=Math.min(1.5+0.11*(stage-1),3.3);
  switch(pattern){
    case 0:return b;
    case 1:return -b*1.15;
    case 2:return b*(0.95+0.8*Math.sin(t*1.6));               // surging
    case 3:return b*1.7*Math.sin(t*1.5);                      // back and forth
    case 4:{const p=(t%2.3)/2.3;return b*(0.12+2.6*Math.pow(Math.max(0,Math.sin(p*Math.PI)),3))} // stop and dash
    default:return b*(1.25*Math.sin(t*1.05)+0.7*Math.sin(t*2.6+1)); // chaos
  }
}
const minGap=()=>HW*0.92/(LR+L);

function newStage(s){
  stage=s;stageHits=0;stageT=0;nails=[];
  golden=s%5===0||s===lastStage();LR=R*(golden?.76:.72);cy=safeT+18+R*.7+LR;buildWood();
  target=golden?10:Math.min(6+s,12);
  pattern=s<=6?s-1:Math.floor(Math.random()*6);
  const obs=golden?3:Math.min(s-1,6);
  let tries=0;while(nails.length<obs&&tries++<400){
    const a=Math.random()*TAU-Math.PI;
    if(nails.every(n=>Math.abs(wrap(n.a-a))>minGap()*2.2))nails.push({a,obs:true});
  }
  rot=Math.random()*TAU;logPop=0;
}
function startGame(){if(HUB&&!hub.ready)return;score=0;newBest=false;won=false;debris=[];flying=null;reload=0;mode='play';newStage(HUB?hub.level:1)}

// ---------- audio ----------
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,dur,type,vol,slide){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur)}
function noise(dur,vol,freq){if(!ac)return;const n=ac.sampleRate*dur,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;s.connect(f).connect(g).connect(ac.destination);s.start()}
const sfx={
  throw(){noise(.08,.15,3000)},
  thunk(){tone(170,.14,'sine',.5,70);noise(.06,.35,900)},
  clang(){tone(1180,.5,'square',.08,900);tone(1730,.4,'triangle',.12,1500);noise(.1,.25,6000)},
  clear(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.18),i*70));noise(.25,.3,1400)}
};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ---------- input ----------
function tap(){
  audio();
  if(mode==='ready'){if(HUB&&!hub.ready)return;startGame();throwNail();return}
  if(mode==='over'){if(HUB){if(overT>.55)hubSend({type:won?'gh-open-claim':'gh-open-buy'});return}if(overT>.55)startGame();return}
  if(mode==='sync'||mode==='clear')return;
  if(mode==='play')throwNail();
}
function throwNail(){if(flying||reload>0)return;flying={y:restY()};sfx.throw()}
const restY=()=>Math.min(H*0.74,H-safeB-L-D-24);
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)tap()}});

// ---------- update ----------
function update(dt){
  stageT+=dt;
  if(hubNoteT>0)hubNoteT-=dt;
  if(mode!=='clear'&&mode!=='sync')rot+=speed(stageT)*(mode==='ready'?.45:1)*dt;
  logPop=Math.min(1,logPop+dt*4);kick*=Math.pow(.0005,dt);shake*=Math.pow(.002,dt);flash=Math.max(0,flash-dt*2.5);
  if(reload>0)reload-=dt;
  if(flying){
    flying.y-=Math.max(2400,H*3.4)*dt;
    if(flying.y<=cy+LR-D){
      const a=wrap(Math.PI/2-rot);
      const hit=nails.find(n=>Math.abs(wrap(n.a-a))<minGap());
      if(hit){fail()}else{
        nails.push({a});flying=null;reload=.06;score++;stageHits++;kick=1;sfx.thunk();buzz(12);
        for(let i=0;i<6;i++)chip(cx,cy+LR,(Math.random()-.5)*360,-Math.random()*200+60,golden);
        if(stageHits>=target)clearStage();
      }
    }
  }
  if(mode==='fail'){failT+=dt;if(failT>.9&&HUB){if(hub.lives>0){mode='play';newStage(stage)}else{mode='over';overT=0;hubSend({type:'gh-open-buy'})}}else if(failT>.9){mode='over';overT=0;if(score>best){best=score;newBest=true;try{localStorage.setItem('nailhit-best',best)}catch(e){}}}}
  if(mode==='over')overT+=dt;
  if(mode==='clear'){clearT+=dt;if(clearT>.75&&HUB){hubAdvance()}else if(clearT>.75){
    if(stage>=MAX_STAGE){won=true;mode='over';overT=0;logPop=0;if(score>best){best=score;newBest=true;try{localStorage.setItem('nailhit-best',best)}catch(e){}}}
    else{mode='play';newStage(stage+1)}}}
  for(const p of debris){p.vy+=1900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.ang+=p.va*dt;p.life-=dt}
  debris=debris.filter(p=>p.life>0&&p.y<H+200);
  for(const d of dust){d.y-=d.s*dt;if(d.y<0)d.y=1}
}
function chip(x,y,vx,vy,gold){debris.push({type:'chip',x,y,vx,vy,ang:Math.random()*TAU,va:(Math.random()-.5)*20,life:1.4,s:R*(.05+Math.random()*.07),gold})}
function fail(){
  const y=flying.y;flying=null;mode='fail';failT=0;if(HUB){hub.lives=Math.max(0,hub.lives-1);hubSend({type:'gh-life-lost',level:stage})}shake=reduce?0:1;flash=1;sfx.clang();buzz([60,40,90]);
  debris.push({type:'nail',x:cx,y,vx:(Math.random()<.5?-1:1)*(140+Math.random()*120),vy:-260,ang:Math.PI/2,va:(Math.random()<.5?-1:1)*9,life:3,red:true});
}
function clearStage(){
  mode='clear';clearT=0;sfx.clear();buzz(40);shake=reduce?0:.5;
  for(const n of nails){const th=n.a+rot,r=LR-D,dx=Math.cos(th),dy=Math.sin(th);
    debris.push({type:'nail',x:cx+dx*r,y:cy+dy*r,vx:dx*(300+Math.random()*250),vy:dy*(300+Math.random()*250)-250,ang:th,va:(Math.random()-.5)*14,life:3,obs:n.obs})}
  for(let i=0;i<26;i++){const th=Math.random()*TAU,s=200+Math.random()*420;chip(cx+Math.cos(th)*LR*.6,cy+Math.sin(th)*LR*.6,Math.cos(th)*s,Math.sin(th)*s-200,golden)}
  nails=[];
}

// ---------- drawing ----------
function nailPath(x,y,ang,red,obs){
  // (x,y) = tip, ang = direction from tip toward head
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const len=L+D,ol=Math.max(1.5,R*.028);
  ctx.lineJoin='round';ctx.strokeStyle='#262a3b';ctx.lineWidth=ol;
  const sg=ctx.createLinearGradient(0,-SW/2,0,SW/2);
  if(red){sg.addColorStop(0,'#ffb3b3');sg.addColorStop(.45,'#e8414b');sg.addColorStop(1,'#9c1f2a')}
  else if(obs){sg.addColorStop(0,'#c9c3b8');sg.addColorStop(.45,'#8f8576');sg.addColorStop(1,'#5d554b')}
  else{sg.addColorStop(0,'#ffffff');sg.addColorStop(.45,'#cfd5e2');sg.addColorStop(1,'#8d96ab')}
  ctx.fillStyle=sg;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(SW*2,-SW/2);ctx.lineTo(len-HT,-SW/2);ctx.lineTo(len-HT,SW/2);ctx.lineTo(SW*2,SW/2);ctx.closePath();ctx.fill();ctx.stroke();
  // head
  const hg=ctx.createLinearGradient(len-HT,0,len,0);
  if(red){hg.addColorStop(0,'#ff8a8a');hg.addColorStop(1,'#c22a35')}
  else if(obs){hg.addColorStop(0,'#b8ad9c');hg.addColorStop(1,'#6e6457')}
  else{hg.addColorStop(0,'#f4f6fb');hg.addColorStop(1,'#aab2c4')}
  ctx.fillStyle=hg;ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(len-HT,-HW/2,HT,HW,HT*.5);else ctx.rect(len-HT,-HW/2,HT,HW);
  ctx.fill();ctx.stroke();
  ctx.restore();
}
function drawCrown(x,y,s,col){
  ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(-s,s*.45);ctx.lineTo(-s*1.05,-s*.35);ctx.lineTo(-s*.5,s*.05);ctx.lineTo(0,-s*.6);ctx.lineTo(s*.5,s*.05);ctx.lineTo(s*1.05,-s*.35);ctx.lineTo(s,s*.45);ctx.closePath();ctx.fill();
  for(const [px,py] of [[-s*1.05,-s*.42],[0,-s*.7],[s*1.05,-s*.42]]){ctx.beginPath();ctx.arc(px,py,s*.16,0,TAU);ctx.fill()}
  ctx.fillRect(-s,s*.58,s*2,s*.2);ctx.restore();
}
function outlinedText(t,x,y,size,fill,stroke,lw){
  ctx.font=`${size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=lw||size*.16;ctx.strokeText(t,x,y)}
  ctx.fillStyle=fill;ctx.fillText(t,x,y);
}
function draw(){
  // backdrop
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#17203b');bg.addColorStop(1,'#3a2a52');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const glow=ctx.createRadialGradient(cx,cy,R*.5,cx,cy,R*4.2);
  glow.addColorStop(0,golden?'rgba(255,214,90,.28)':'rgba(255,170,90,.22)');glow.addColorStop(1,'rgba(255,170,90,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,230,200,.35)';for(const d of dust){ctx.beginPath();ctx.arc(d.x*W,d.y*H,d.r,0,TAU);ctx.fill()}
  if(flash>0){ctx.fillStyle=`rgba(230,50,60,${flash*.25})`;ctx.fillRect(0,0,W,H)}

  ctx.save();
  if(shake>.01){ctx.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*14*shake)}
  const ly=cy-kick*R*.08, sc=easeBack(logPop);

  if(mode!=='clear'){
    ctx.save();ctx.translate(cx,ly);ctx.scale(sc,sc);ctx.translate(-cx,-ly);
    // stuck nails (behind the log)
    for(const n of nails){const th=n.a+rot,r=LR-D;nailPath(cx+Math.cos(th)*r,ly+Math.sin(th)*r,th,false,n.obs)}
    // log slab edge
    ctx.beginPath();ctx.arc(cx,ly+LR*.14,LR,0,TAU);ctx.fillStyle=golden?'#b07a10':'#9a5124';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=golden?'#6b4200':'#4e250b';ctx.stroke();
    // face
    ctx.save();ctx.translate(cx,ly);ctx.rotate(rot);const s=wood.width/DPR;ctx.drawImage(wood,-s/2,-s/2,s,s);ctx.restore();
    // number / crown on the face
    if(mode==='ready'){
      drawCrown(cx,ly-LR*.22,LR*.42,golden?'#7a4c00':'#6b3414');
      outlinedText(String(best),cx,ly+LR*.38,LR*.62,'#6b3414');
    }else{
      outlinedText(String(score),cx,ly+LR*.04,LR*(score>99?.7:.9),'#fffaf2',golden?'#7a4c00':'#5a2c0e',LR*.12);
    }
    ctx.restore();
  }

  // debris
  for(const p of debris){
    if(p.type==='nail'){const len=L+D;nailPath(p.x-Math.cos(p.ang)*len/2,p.y-Math.sin(p.ang)*len/2,p.ang,p.red,p.obs)}
    else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);ctx.globalAlpha=Math.min(1,p.life*1.5);ctx.fillStyle=p.gold?'#f2c344':'#d98b45';ctx.strokeStyle=p.gold?'#7a4c00':'#5a2c0e';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-p.s,-p.s*.6);ctx.lineTo(p.s,-p.s*.2);ctx.lineTo(-p.s*.2,p.s*.7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
  }

  // nail in hand
  if(flying)nailPath(cx,flying.y,Math.PI/2);
  else if(mode==='ready'||mode==='play')nailPath(cx,restY()+(reload>0?reload*300:0),Math.PI/2);
  ctx.restore();

  // HUD
  const top=safeT+18;
  if(mode==='ready'){
    outlinedText('NAIL HIT',cx,top+R*.32,R*.48,'#fff3e2','#5a2c0e',R*.1);
    const pulse=1+Math.sin(performance.now()/260)*.06;
    outlinedText(HUB&&!hub.ready?'LOADING':'TAP!',cx,cy+LR*1.55,R*.4*pulse,'#ffffff','rgba(0,0,0,.35)',R*.06);
    if(HUB&&hub.ready){outlinedText(hub.level>1?`Continue stage ${hub.level}`:`Reach stage ${hub.target} to win ${hub.rewardGb}GB`,cx,cy+LR*1.55+R*.55,R*.22,'#fff3e2','rgba(0,0,0,.35)',R*.04);
      outlinedText(`${hub.lives} ${hub.lives===1?'life':'lives'}`,cx,cy+LR*1.55+R*.95,R*.22,'#ffd84f','rgba(0,0,0,.35)',R*.04)}
  }else{
    ctx.font=`${Math.round(R*.24)}px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=golden?'#ffd84f':'#fff3e2';
    ctx.fillText(stage===lastStage()?`FINAL LOG · STAGE ${stage}/${lastStage()}`:golden?`GOLDEN LOG · STAGE ${stage}/${lastStage()}`:`STAGE ${stage}/${lastStage()}`,Math.max(16,W*.05),top+R*.18);
    // progress pips
    const pw=Math.min(R*.2,(W*.55)/target), px0=Math.max(16,W*.05);
    for(let i=0;i<target;i++){ctx.fillStyle=i<stageHits?(golden?'#ffd84f':'#ffb15c'):'rgba(255,255,255,.18)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(px0+i*pw*1.25,top+R*.42,pw,R*.09,R*.05);else ctx.rect(px0+i*pw*1.25,top+R*.42,pw,R*.09);ctx.fill()}
    drawCrown(W-Math.max(16,W*.05)-R*.62,top+R*.2,R*.14,'#ffd84f');
    ctx.textAlign='right';ctx.fillStyle='#fff3e2';ctx.font=`${Math.round(R*.26)}px ${FONT}`;ctx.fillText(String(Math.max(best,score)),W-Math.max(16,W*.05),top+R*.2);
  }
  if(hubNoteT>0)outlinedText(hubNote,cx,safeT+R*1.4,R*.2,'#ffd84f','rgba(0,0,0,.5)',R*.04);
  if(mode==='over'){
    const a=Math.min(1,overT*3);ctx.fillStyle=`rgba(12,14,30,${.55*a})`;ctx.fillRect(0,0,W,H);
    const by=cy+LR+L+R*.6;
    ctx.globalAlpha=a;
    if(HUB){outlinedText(won?'YOU WIN!':'OUT OF LIVES',cx,by,R*.5,won?'#ffd84f':'#ff6b72','#1a1020',R*.1);outlinedText(won?`Claim your ${hub.rewardGb}GB`:`Stage ${stage} is waiting`,cx,by+R*.62,R*.28,'#fff3e2');if(overT>.55)outlinedText(won?'TAP TO CLAIM':'TAP FOR OPTIONS',cx,by+R*1.3,R*.26*(1+Math.sin(performance.now()/260)*.04),'#ffffff');ctx.globalAlpha=1;return}
    outlinedText(won?'YOU WIN!':newBest?'NEW BEST!':'MISSED!',cx,by,R*.5,(won||newBest)?'#ffd84f':'#ff6b72','#1a1020',R*.1);
    outlinedText(`${score} nail${score===1?'':'s'}  ·  stage ${stage}`,cx,by+R*.62,R*.28,'#fff3e2');
    drawCrown(cx-R*.62,by+R*1.12,R*.14,'#ffd84f');
    ctx.textAlign='left';ctx.font=`${Math.round(R*.28)}px ${FONT}`;ctx.fillStyle='#ffd84f';ctx.fillText(`Best ${best}`,cx-R*.4,by+R*1.12);
    if(overT>.55)outlinedText('TAP TO PLAY AGAIN',cx,by+R*1.8,R*.26*(1+Math.sin(performance.now()/260)*.04),'#ffffff');
    ctx.globalAlpha=1;
  }
}
function easeBack(t){const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}

let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
addEventListener('resize',resize);
resize();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{});
requestAnimationFrame(frame);
if(HUB)hubSend({type:'gh-ready'});
})();
</script>
