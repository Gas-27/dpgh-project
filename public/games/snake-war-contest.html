<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Snake War Live Contest - GameHub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1f0a; color: #fff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; touch-action: none; }
#stage { position: fixed; inset: 0; width: 100vw; height: 100dvh; }
#gameCanvas { display: block; width: 100%; height: 100%; }

#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem;
  padding: max(0.5rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right)) 0 max(0.75rem, env(safe-area-inset-left));
}
.hud-left { display: flex; align-items: center; gap: 0.6rem; }
#leaveBtn {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.4rem 0.7rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22);
  background: rgba(0,0,0,0.55); color: #fff; font-size: 0.75rem; font-weight: 700; cursor: pointer;
}
.stat { display: flex; flex-direction: column; line-height: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.stat b { font-size: 1.35rem; font-weight: 900; }
.stat span { font-size: 0.58rem; letter-spacing: 1px; text-transform: uppercase; color: #a7b4a7; margin-top: 2px; }
.hud-mid { position: absolute; left: 50%; transform: translateX(-50%); top: 0; padding: max(0.4rem, env(safe-area-inset-top)) 1.1rem 0.4rem; background: rgba(0,0,0,0.55); border-radius: 0 0 0.9rem 0.9rem; text-align: center; min-width: 96px; }
#timerVal { font-size: 1.5rem; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
#timerLbl { font-size: 0.55rem; letter-spacing: 1px; text-transform: uppercase; color: #a7b4a7; }
.hud-mid.urgent #timerVal { color: #ef4444; animation: pulse 0.5s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }

.hud-right { position: relative; display: flex; flex-direction: column; align-items: flex-end; }
#lbToggle {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer;
  padding: 0.4rem 0.7rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22);
  background: rgba(0,0,0,0.55); color: #fff; font-size: 0.78rem; font-weight: 800; font-variant-numeric: tabular-nums;
}
#lbToggle .caret { display: inline-block; transition: transform 0.15s; font-size: 0.65rem; }
#lbToggle[aria-expanded="true"] .caret { transform: rotate(180deg); }
#lbPanel {
  display: none; margin-top: 6px; width: min(88vw, 340px); gap: 0.6rem; padding: 0.6rem;
  background: rgba(4,12,4,0.72); border: 1px solid rgba(255,255,255,0.14); border-radius: 0.8rem;
  pointer-events: none; max-height: calc(100dvh - 4.5rem); overflow: hidden;
}
#lbPanel.open { display: flex; }
#minimap { width: 104px; height: 104px; flex: none; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); }
#lbList { flex: 1; min-width: 0; font-size: 0.74rem; }
#lbList h4 { font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; color: #a7b4a7; margin-bottom: 0.3rem; }
.row { display: flex; justify-content: space-between; gap: 0.5rem; padding: 2px 0; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.me { color: #4ade80; font-weight: 800; }
.row.ai { color: #9ca3af; }
.row .ai-tag { font-size: 0.55rem; border: 1px solid #6b7280; border-radius: 4px; padding: 0 3px; margin-left: 4px; }
.sep { text-align: center; color: #6b7280; line-height: 0.8; }
.online { margin-top: 0.35rem; color: #a7b4a7; font-size: 0.65rem; }

#boostWrap { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(0.6rem, env(safe-area-inset-bottom)); width: 150px; pointer-events: none; text-align: center; }
#boostBg { height: 6px; background: rgba(255,255,255,0.14); border-radius: 3px; }
#boostFill { height: 100%; width: 100%; border-radius: 3px; background: linear-gradient(90deg,#22c55e,#a3e635); }
#boostLbl { font-size: 0.55rem; letter-spacing: 1px; color: #a7b4a7; margin-top: 2px; }

#note { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(0.6rem, env(safe-area-inset-bottom)) + 2.2rem); z-index: 4; padding: 0.4rem 0.9rem; border-radius: 999px; background: rgba(0,0,0,0.65); font-size: 0.78rem; font-weight: 600; pointer-events: none; transition: opacity 0.6s; text-align: center; max-width: 90vw; }
#note.hide { opacity: 0; }
#toast { position: fixed; left: 50%; top: 32%; transform: translateX(-50%); z-index: 6; padding: 0.5rem 1.1rem; border-radius: 0.7rem; background: rgba(239,68,68,0.9); font-weight: 800; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
#toast.show { opacity: 1; }

#zoneL { position: fixed; left: 0; top: 18%; bottom: 0; width: 55%; z-index: 3; touch-action: none; display: none; }
#joyBase { position: fixed; z-index: 4; width: 108px; height: 108px; margin: -54px 0 0 -54px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.22); background: rgba(0,0,0,0.3); pointer-events: none; display: none; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; background: rgba(255,255,255,0.5); }
#boostBtn {
  display: none; position: fixed; z-index: 4; width: 84px; height: 84px; border-radius: 50%; border: none;
  right: max(1.2rem, calc(env(safe-area-inset-right) + 0.8rem)); bottom: max(1.2rem, calc(env(safe-area-inset-bottom) + 0.8rem));
  background: linear-gradient(135deg,#22c55e,#16a34a); color: #fff; font-weight: 800; font-size: 0.8rem; letter-spacing: 1px;
  box-shadow: 0 0 22px rgba(34,197,94,0.5); touch-action: none;
}
@media (pointer: coarse) { #zoneL, #boostBtn { display: block; } #joyBase { display: block; } #boostLbl { display: none; } }
@media (max-height: 460px) { #joyBase { width: 92px; height: 92px; margin: -46px 0 0 -46px; } #boostBtn { width: 72px; height: 72px; } #minimap { width: 84px; height: 84px; } #lbPanel { width: min(88vw, 300px); } }

#endOverlay { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 1.2rem; text-align: center; background: rgba(0,0,0,0.85); }
#endOverlay.show { display: flex; }
#endOverlay h2 { font-size: 2rem; font-weight: 900; color: #4ade80; margin-bottom: 0.2rem; }
#endSub { color: #a7b4a7; font-size: 0.9rem; margin-bottom: 1rem; max-width: 320px; }
#endPodium { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
.prow { display: flex; justify-content: space-between; padding: 0.4rem 0.8rem; border-radius: 0.5rem; background: rgba(255,255,255,0.07); font-size: 0.88rem; }
.prow.win { background: rgba(74,222,128,0.18); color: #4ade80; font-weight: 800; }
.prow.me { border-left: 3px solid #06b6d4; }
#endStatus { color: #fde68a; font-size: 0.85rem; font-weight: 700; margin-bottom: 1rem; }
#closeBtn { padding: 0.8rem 2.2rem; border: none; border-radius: 0.7rem; background: linear-gradient(90deg,#22c55e,#16a34a); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-left">
      <button id="leaveBtn" type="button" aria-label="Leave match">Leave</button>
      <div class="stat"><b id="hudScore">0</b><span>Score</span></div>
      <div class="stat"><b id="hudLen">15</b><span>Length</span></div>
    </div>
    <div class="hud-mid" id="timer"><div id="timerVal">--:--</div><div id="timerLbl">Time left</div></div>
    <div class="hud-right">
      <button id="lbToggle" type="button" aria-expanded="false" aria-controls="lbPanel"><span id="lbRank">#-</span><span>Leaderboard</span><span class="caret">&#9660;</span></button>
      <div id="lbPanel">
        <canvas id="minimap" width="104" height="104"></canvas>
        <div id="lbList"></div>
      </div>
    </div>
  </div>

  <div id="note"></div>
  <div id="toast"></div>
  <div id="boostWrap"><div id="boostBg"><div id="boostFill"></div></div><div id="boostLbl">BOOST (HOLD SPACE)</div></div>

  <div id="zoneL"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="boostBtn" type="button">BOOST</button>

  <div id="endOverlay">
    <h2>Round over</h2>
    <div id="endSub"></div>
    <div id="endPodium"></div>
    <div id="endStatus">Submitting your result...</div>
    <button id="closeBtn" type="button">Close</button>
  </div>
</div>

<script>
'use strict';

// ── Params: everyone in the room shares one clock (server time) ──────────────
const P = new URLSearchParams(location.search);
const ATTEMPT = P.get('attempt') || '';
const MINUTES = Math.max(1, Math.min(30, parseInt(P.get('minutes') || '4', 10) || 4));
const MY_NAME = (P.get('name') || 'Player').replace(/[<>]/g, '').slice(0, 16) || 'Player';
const MY_ID = P.get('uid') || ('guest' + Math.random().toString(36).slice(2, 8));
const RS = Number(P.get('rs')) || Date.now();
const RE = Number(P.get('re')) || (RS + MINUTES * 60000);
const SKEW = Number(P.get('skew')) || 0;
const now = () => Date.now() + SKEW;

// ── Constants ────────────────────────────────────────────────────────────────
const GAME_W = 6000, GAME_H = 6000, SEG = 10, FOOD_R = 7, INIT_LEN = 15;
const SPEED = 3.5, BOOST_SPD = 6.5, TICK_MS = 1000 / 60;
const FOOD_TOTAL = 650, MAX_BOTS = 14, SEND_MS = 200;
const AI_NAMES = ['Viper','Python','Cobra','Mamba','Anaconda','Basilisk','Boa','Rattler','Asp','Krait','Garter','King','Water','Coral'];
const MAPS = [
  { bg:'#0a1f0a', grid:'#1a3a1a', accent:'#22c55e', food:['#22c55e','#84cc16','#eab308','#f97316','#ef4444'] },
  { bg:'#0a1929', grid:'#1a3a5c', accent:'#06b6d4', food:['#06b6d4','#3b82f6','#8b5cf6','#06d6a0','#00f5d4'] },
  { bg:'#1f1a0a', grid:'#3d3520', accent:'#f59e0b', food:['#f59e0b','#ef4444','#fb923c','#fbbf24','#a3e635'] },
  { bg:'#0a0a1f', grid:'#1a1a3d', accent:'#a855f7', food:['#a855f7','#ec4899','#06b6d4','#22d3ee','#f472b6'] },
  { bg:'#1a0a0a', grid:'#3d1a1a', accent:'#ef4444', food:['#ef4444','#f97316','#fbbf24','#dc2626','#fb7185'] }
];
const SKINS = [
  ['#22c55e','#16a34a','#15803d'], ['#ef4444','#dc2626','#b91c1c'], ['#3b82f6','#2563eb','#1d4ed8'],
  ['#a855f7','#9333ea','#7e22ce'], ['#f59e0b','#d97706','#b45309'], ['#fb7185','#f43f5e','#e11d48'],
  ['#06b6d4','#0891b2','#0e7490'], ['#fbbf24','#f59e0b','#d97706'], ['#22d3ee','#a855f7','#ec4899'], ['#84cc16','#65a30d','#4d7c0f']
];
const MAP = MAPS[RS % MAPS.length];

// ── Seeded random (same food field for every player) ─────────────────────────
function xmur3(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; }; }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const MY_SKIN = xmur3(MY_ID)() % SKINS.length;

function makeFood(slot, gen) {
  const r = mulberry32(xmur3(RS + ':' + slot + ':' + gen)());
  return { slot, gen, x: 120 + r() * (GAME_W - 240), y: 120 + r() * (GAME_H - 240), color: MAP.food[Math.floor(r() * MAP.food.length)], r: FOOD_R * (0.7 + r() * 0.6), pulse: r() * 6.28 };
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);

// ── Network bridge (parent page owns the Supabase Realtime channel) ──────────
let netReady = false;
function send(event, payload) { if (netReady) parent.postMessage({ type: 'snake-net-send', event, payload }, '*'); }
function hello() { parent.postMessage({ type: 'snake-net-hello' }, '*'); }

// ── State ────────────────────────────────────────────────────────────────────
const S = {
  food: [], drops: new Map(), peers: new Map(), bots: new Map(), particles: [],
  me: null, cam: { x: 0, y: 0 }, W: 0, H: 0, Z: 1, scale: 1,
  running: true, joinedAt: Date.now(), botsStarted: false, botRespawn: new Map(),
  eatQueue: [], botEats: [], dropSeq: 0, mouse: { x: 0, y: 0 }, joy: null,
  lastSend: 0, lastHud: 0, frame: 0, resultSent: false, lbOpen: false
};

function mkSnake(id, name, skin, kind, x, y, len, angle) {
  const body = [];
  const a = angle || 0, c = Math.cos(a), s = Math.sin(a);
  for (let i = 0; i < len; i++) body.push({ x: x - c * i * SPEED, y: y - s * i * SPEED });
  return { id, name, skin, kind, body, dir: { x: c, y: s }, nextDir: { x: c, y: s }, score: 0, kills: 0, length: len,
    alive: true, isBoosting: false, boostEnergy: 100, immunity: 90, ex: 0, ey: 0, seen: Date.now() };
}
function spawnPoint() {
  const zones = [[800,800],[GAME_W-800,800],[800,GAME_H-800],[GAME_W-800,GAME_H-800],[GAME_W/2,800],[GAME_W/2,GAME_H-800],[800,GAME_H/2],[GAME_W-800,GAME_H/2],[GAME_W/2,GAME_H/2]];
  const z = zones[Math.floor(Math.random() * zones.length)];
  return { x: z[0] + (Math.random() - 0.5) * 600, y: z[1] + (Math.random() - 0.5) * 600 };
}
function freshPeers() { const t = Date.now(); const out = []; S.peers.forEach((p) => { if (t - p.seen < 4000) out.push(p); }); return out; }
function allSnakes() { const out = [S.me]; S.peers.forEach((p) => out.push(p)); S.bots.forEach((b) => out.push(b)); return out; }
function isHost() { if (Date.now() - S.joinedAt < 1500) return false; return freshPeers().every((p) => MY_ID < p.id); }

// ── Food and drops ───────────────────────────────────────────────────────────
function applyEats(list) {
  if (!Array.isArray(list)) return;
  for (const e of list) {
    const id = e[0], g = e[1];
    if (typeof id === 'number') { const f = S.food[id]; if (f && f.gen === g) S.food[id] = makeFood(id, g + 1); }
    else S.drops.delete(id);
  }
}
function addDrops(owner, seq, pts, skin) {
  if (!Array.isArray(pts)) return;
  const color = SKINS[skin % SKINS.length][0];
  pts.forEach((p, i) => { S.drops.set(owner + '.' + seq + '.' + i, { x: p[0], y: p[1], color, r: FOOD_R * 1.6, pulse: 0 }); });
  while (S.drops.size > 500) S.drops.delete(S.drops.keys().next().value);
}
function eatNearby(sn, queue) {
  const hd = sn.body[0];
  for (let i = 0; i < S.food.length; i++) {
    const f = S.food[i], dx = hd.x - f.x, dy = hd.y - f.y, rr = SEG + f.r;
    if (dx * dx + dy * dy < rr * rr) { sn.length += 1; sn.score += 1; queue.push([i, f.gen]); S.food[i] = makeFood(i, f.gen + 1); burst(f.x, f.y, f.color, 4); }
  }
  S.drops.forEach((f, id) => {
    const dx = hd.x - f.x, dy = hd.y - f.y, rr = SEG + f.r;
    if (dx * dx + dy * dy < rr * rr) { sn.length += 2; sn.score += 2; queue.push([id, 0]); S.drops.delete(id); burst(f.x, f.y, f.color, 4); }
  });
}
function burst(x, y, color, n) {
  if (S.particles.length > 220) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, sp = 1 + Math.random() * 3; S.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 30 + Math.random() * 15, color, size: 2 + Math.random() * 2.5 }); }
}

// ── Movement shared by every snake ───────────────────────────────────────────
function move(sn, lf) {
  sn.dir.x += (sn.nextDir.x - sn.dir.x) * lf; sn.dir.y += (sn.nextDir.y - sn.dir.y) * lf;
  const ln = Math.hypot(sn.dir.x, sn.dir.y); if (ln) { sn.dir.x /= ln; sn.dir.y /= ln; }
  const spd = sn.isBoosting ? BOOST_SPD : SPEED;
  const cx = sn.ex * 0.1, cy = sn.ey * 0.1; sn.ex -= cx; sn.ey -= cy;
  const h = sn.body[0];
  sn.body.unshift({ x: Math.max(50, Math.min(GAME_W - 50, h.x + sn.dir.x * spd + cx)), y: Math.max(50, Math.min(GAME_H - 50, h.y + sn.dir.y * spd + cy)) });
  while (sn.body.length > Math.ceil(sn.length)) sn.body.pop();
}
function boostTick(sn) {
  if (sn.isBoosting) { sn.boostEnergy -= 0.85; if (sn.boostEnergy <= 0) { sn.isBoosting = false; sn.boostEnergy = 0; } }
  else if (sn.boostEnergy < 100) sn.boostEnergy += 0.32;
}
function hitsBody(sn, others) {
  const hd = sn.body[0];
  for (const o of others) {
    if (o.id === sn.id || !o.alive || !o.body.length) continue;
    const reach = o.body.length * SPEED + 40, h2 = o.body[0];
    if (Math.abs(hd.x - h2.x) > reach || Math.abs(hd.y - h2.y) > reach) continue;
    const stride = o.body.length > 400 ? 2 : 1, lim = (SEG * 1.15) * (SEG * 1.15);
    for (let i = 3; i < o.body.length; i += stride) {
      const dx = hd.x - o.body[i].x, dy = hd.y - o.body[i].y;
      if (dx * dx + dy * dy < lim) return o;
    }
  }
  return null;
}
function dropPoints(sn) {
  const n = Math.min(sn.body.length, 180), pts = [];
  for (let i = 0; i < n; i += 2) pts.push([Math.round(sn.body[i].x), Math.round(sn.body[i].y)]);
  return pts;
}

// ── Me ───────────────────────────────────────────────────────────────────────
function respawnMe(keepKills) {
  const sp = spawnPoint(), old = S.me;
  S.me = mkSnake(MY_ID, MY_NAME, MY_SKIN, 'me', sp.x, sp.y, INIT_LEN, Math.random() * 6.28);
  S.me.immunity = 150; if (keepKills && old) S.me.kills = old.kills;
  S.cam.x = sp.x - S.W / S.Z / 2; S.cam.y = sp.y - S.H / S.Z / 2;
}
function killMe(by) {
  const me = S.me; me.alive = false;
  const pts = dropPoints(me), seq = ++S.dropSeq;
  addDrops(MY_ID, seq, pts, me.skin);
  burst(me.body[0].x, me.body[0].y, SKINS[me.skin][0], 30);
  send('die', { u: MY_ID, by: by.id, pts, c: me.skin, t: seq });
  showToast('Eaten by ' + by.name);
  setTimeout(() => { if (S.running) respawnMe(true); }, 900);
}
function updateMe() {
  const me = S.me; if (!me.alive) return;
  if (me.immunity > 0) me.immunity--;
  if (S.joy) { me.nextDir = { x: S.joy.x, y: S.joy.y }; }
  else {
    const hx = (me.body[0].x - S.cam.x) * S.Z, hy = (me.body[0].y - S.cam.y) * S.Z;
    const dx = S.mouse.x - hx, dy = S.mouse.y - hy;
    if (Math.hypot(dx, dy) > 4) { const a = Math.atan2(dy, dx); me.nextDir = { x: Math.cos(a), y: Math.sin(a) }; }
  }
  move(me, 0.16); boostTick(me);
  eatNearby(me, S.eatQueue);
  if (me.immunity <= 0) { const o = hitsBody(me, allSnakes()); if (o) killMe(o); }
}

// ── Bots (simulated by one elected player, mirrored to everyone else) ────────
function botTarget() { return Math.max(6, MAX_BOTS - freshPeers().length); }
function aiUpdate(sn) {
  const head = sn.body[0];
  let best = null, bd = 810000;
  for (let i = 0; i < S.food.length; i++) { const f = S.food[i], dx = head.x - f.x, dy = head.y - f.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = f; } }
  if (Math.random() < 0.025) {
    for (const s of allSnakes()) {
      if (s.id === sn.id || !s.alive || s.length >= sn.length * 1.4) continue;
      const d = Math.hypot(head.x - s.body[0].x, head.y - s.body[0].y);
      if (d < 700 && d * d < bd) { bd = d * d; best = s.body[0]; }
    }
  }
  if (best) { const a = Math.atan2(best.y - head.y, best.x - head.x); sn.nextDir = { x: Math.cos(a), y: Math.sin(a) }; }
  else if (Math.random() < 0.012) { const a = Math.random() * 6.28; sn.nextDir = { x: Math.cos(a), y: Math.sin(a) }; }
  if (head.x < 350) sn.nextDir.x = Math.abs(sn.nextDir.x); if (head.x > GAME_W - 350) sn.nextDir.x = -Math.abs(sn.nextDir.x);
  if (head.y < 350) sn.nextDir.y = Math.abs(sn.nextDir.y); if (head.y > GAME_H - 350) sn.nextDir.y = -Math.abs(sn.nextDir.y);
  if (Math.random() < 0.004 && sn.boostEnergy > 45) sn.isBoosting = true; else if (Math.random() < 0.05) sn.isBoosting = false;
}
function spawnBot(idx) {
  const sp = spawnPoint(), id = 'bot' + idx;
  S.bots.set(id, mkSnake(id, AI_NAMES[idx % AI_NAMES.length], (idx * 3 + 1) % SKINS.length, 'bot', sp.x, sp.y, INIT_LEN, Math.random() * 6.28));
}
function hostBots() {
  const target = botTarget();
  for (let i = 0; i < MAX_BOTS; i++) {
    const id = 'bot' + i;
    if (i >= target) { S.bots.delete(id); continue; }
    if (!S.bots.has(id) && !S.botRespawn.has(id)) spawnBot(i);
  }
  S.bots.forEach((b, id) => {
    b.seen = Date.now();
    if (b.immunity > 0) b.immunity--;
    aiUpdate(b); move(b, 0.16); boostTick(b); eatNearby(b, S.botEats);
    if (b.immunity <= 0) {
      const o = hitsBody(b, allSnakes());
      if (o) {
        const pts = dropPoints(b), seq = ++S.dropSeq;
        addDrops(id, seq, pts, b.skin);
        send('botdead', { id, by: o.id, pts, c: b.skin, t: seq });
        if (o.id === MY_ID) S.me.kills++;
        S.bots.delete(id);
        const idx = Number(id.slice(3));
        S.botRespawn.set(id, setTimeout(() => { S.botRespawn.delete(id); if (isHost() && idx < botTarget()) spawnBot(idx); }, 1200));
      }
    }
  });
}

// ── Remote players and bots ──────────────────────────────────────────────────
function upsertRemote(map, id, name, skin, kind, x, y, angle, len, boost, score, kills, alive) {
  let r = map.get(id);
  if (!r) { r = mkSnake(id, name, skin, kind, x, y, Math.max(INIT_LEN, len), angle); r.immunity = 0; map.set(id, r); }
  if (alive && !r.alive) { const k = r.kills; const n = mkSnake(id, name, skin, kind, x, y, Math.max(INIT_LEN, len), angle); n.immunity = 0; n.kills = k; map.set(id, n); r = n; }
  r.seen = Date.now(); r.name = name; r.skin = skin; r.alive = !!alive;
  r.nextDir = { x: Math.cos(angle), y: Math.sin(angle) };
  r.length = Math.max(INIT_LEN, len); r.isBoosting = !!boost; r.score = score; r.kills = kills;
  const h = r.body[0], ex = x - h.x, ey = y - h.y;
  if (Math.hypot(ex, ey) > 300) { for (const seg of r.body) { seg.x += ex; seg.y += ey; } r.ex = 0; r.ey = 0; } else { r.ex = ex; r.ey = ey; }
}
function updateRemotes() {
  const t = Date.now();
  S.peers.forEach((p, id) => { if (t - p.seen > 5000) S.peers.delete(id); else if (p.alive) move(p, 0.3); });
  const host = isHost();
  S.bots.forEach((b, id) => { if (!host) { if (t - b.seen > 2500) S.bots.delete(id); else move(b, 0.3); } });
}
function onNet(event, d) {
  if (!d) return;
  if (event === 'st') {
    if (d.u === MY_ID || typeof d.x !== 'number') return;
    upsertRemote(S.peers, d.u, String(d.n || 'Player').slice(0, 16), (d.k | 0) % SKINS.length, 'peer', d.x, d.y, d.a || 0, d.l || INIT_LEN, d.b, d.s | 0, d.d | 0, d.al);
    applyEats(d.e);
  } else if (event === 'bots') {
    if (isHost()) return;
    (d.b || []).forEach((b) => upsertRemote(S.bots, 'bot' + b[0], AI_NAMES[b[0] % AI_NAMES.length], b[6] % SKINS.length, 'bot', b[1], b[2], b[3], b[4], b[5], b[8] | 0, b[7] | 0, 1));
    applyEats(d.e);
  } else if (event === 'die') {
    const p = S.peers.get(d.u); if (p) p.alive = false;
    addDrops(d.u, d.t, d.pts, d.c | 0);
    if (d.by === MY_ID && S.me) S.me.kills++;
  } else if (event === 'botdead') {
    if (!isHost()) S.bots.delete(d.id);
    addDrops(d.id, d.t, d.pts, d.c | 0);
    if (d.by === MY_ID && S.me) S.me.kills++;
  } else if (event === 'bye') {
    S.peers.delete(d.u);
  }
}
window.addEventListener('message', (e) => {
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (m.type === 'snake-net-ready') { netReady = true; broadcast(true); }
  else if (m.type === 'snake-net-recv') onNet(m.event, m.payload);
  else if (m.type === 'snake-contest-saved') { $('endStatus').textContent = 'Result saved. Winners are announced when the contest closes.'; }
});

function broadcast(force) {
  const t = Date.now(); if (!force && t - S.lastSend < SEND_MS) return; S.lastSend = t;
  const me = S.me, h = me.body[0];
  send('st', { u: MY_ID, n: MY_NAME, k: me.skin, x: Math.round(h.x), y: Math.round(h.y), a: Math.round(Math.atan2(me.dir.y, me.dir.x) * 100) / 100, l: Math.round(me.length), b: me.isBoosting ? 1 : 0, s: me.score, d: me.kills, al: me.alive ? 1 : 0, e: S.eatQueue.splice(0) });
  if (isHost() && S.bots.size) {
    const arr = [];
    S.bots.forEach((b, id) => { const bh = b.body[0]; arr.push([Number(id.slice(3)), Math.round(bh.x), Math.round(bh.y), Math.round(Math.atan2(b.dir.y, b.dir.x) * 100) / 100, Math.round(b.length), b.isBoosting ? 1 : 0, b.skin, b.kills, b.score]); });
    send('bots', { b: arr, e: S.botEats.splice(0) });
  }
}

// ── Leaderboard (display only) ───────────────────────────────────────────────
function ranked() {
  const arr = [];
  allSnakes().forEach((s) => { if (s.kind === 'me' || s.alive) arr.push({ id: s.id, name: s.name, len: Math.floor(s.length), kind: s.kind, skin: s.skin, x: s.body[0].x, y: s.body[0].y }); });
  return arr.sort((a, b) => b.len - a.len);
}
function refreshHud() {
  const list = ranked(), idx = list.findIndex((r) => r.kind === 'me'), humans = list.filter((r) => r.kind !== 'bot');
  const hIdx = humans.findIndex((r) => r.kind === 'me');
  $('hudScore').textContent = S.me.score; $('hudLen').textContent = Math.floor(S.me.length);
  $('lbRank').textContent = '#' + (idx + 1) + ' of ' + list.length;
  const row = (r, i) => '<div class="row' + (r.kind === 'me' ? ' me' : '') + (r.kind === 'bot' ? ' ai' : '') + '"><span class="nm">#' + (i + 1) + ' ' + esc(r.name) + (r.kind === 'bot' ? '<span class="ai-tag">AI</span>' : '') + (r.kind === 'me' ? ' (you)' : '') + '</span><span>' + r.len + '</span></div>';
  if (S.lbOpen) {
    let html = '<h4>Longest snakes</h4>' + list.slice(0, 5).map(row).join('');
    if (idx >= 5) html += '<div class="sep">...</div>' + row(list[idx], idx);
    html += '<div class="online">' + humans.length + ' player' + (humans.length === 1 ? '' : 's') + ' live - you are #' + (hIdx + 1) + ' of ' + humans.length + '</div>';
    $('lbList').innerHTML = html;
    drawMinimap(list);
  }
}
function drawMinimap(list) {
  const c = $('minimap'), g = c.getContext('2d'), w = c.width, h = c.height, sx = w / GAME_W, sy = h / GAME_H;
  g.fillStyle = MAP.bg; g.fillRect(0, 0, w, h);
  g.fillStyle = MAP.accent + '22'; g.fillRect(0, 0, w, h);
  list.forEach((r) => {
    const col = SKINS[r.skin % SKINS.length][0];
    g.fillStyle = r.kind === 'bot' ? col + '66' : col;
    g.beginPath(); g.arc(r.x * sx, r.y * sy, r.kind === 'me' ? 3.5 : r.kind === 'peer' ? 2.8 : 1.8, 0, 6.28); g.fill();
    if (r.kind === 'me') { g.strokeStyle = '#fff'; g.lineWidth = 1.2; g.stroke(); }
  });
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1;
  g.strokeRect(S.cam.x * sx, S.cam.y * sy, (S.W / S.Z) * sx, (S.H / S.Z) * sy);
}
function showToast(text) { const t = $('toast'); t.textContent = text; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1200); }

// ── Round end ────────────────────────────────────────────────────────────────
function endRound() {
  if (!S.running) return; S.running = false;
  const humans = ranked().filter((r) => r.kind !== 'bot');
  const myRank = humans.findIndex((r) => r.kind === 'me');
  const length = Math.floor(S.me.length);
  $('endSub').textContent = myRank === 0 ? 'You have the longest snake in this room. Final standings are confirmed when the contest closes.' : 'You finished #' + (myRank + 1) + ' of ' + humans.length + ' in this room with ' + length + ' segments.';
  $('endPodium').innerHTML = humans.slice(0, 5).map((r, i) => '<div class="prow' + (i === 0 ? ' win' : '') + (r.kind === 'me' ? ' me' : '') + '"><span>#' + (i + 1) + ' ' + esc(r.name) + '</span><span>' + r.len + ' segs</span></div>').join('');
  $('endOverlay').classList.add('show');
  if (!S.resultSent) { S.resultSent = true; parent.postMessage({ type: 'snake-contest-result', attemptId: ATTEMPT, length }, '*'); }
}
function leave() { send('bye', { u: MY_ID }); setTimeout(() => parent.postMessage({ type: 'snake-leave' }, '*'), 60); }
$('leaveBtn').onclick = leave; $('closeBtn').onclick = leave;
window.addEventListener('pagehide', () => send('bye', { u: MY_ID }));

// ── Input ────────────────────────────────────────────────────────────────────
const canvas = $('gameCanvas'), ctx = canvas.getContext('2d');
canvas.addEventListener('mousemove', (e) => { S.joy = null; S.mouse.x = e.clientX; S.mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => { if (S.me) S.me.isBoosting = true; });
window.addEventListener('mouseup', () => { if (S.me) S.me.isBoosting = false; });
window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); if (S.me) S.me.isBoosting = true; } });
window.addEventListener('keyup', (e) => { if (e.code === 'Space' && S.me) S.me.isBoosting = false; });
const bb = $('boostBtn');
bb.addEventListener('pointerdown', (e) => { e.preventDefault(); bb.setPointerCapture(e.pointerId); if (S.me) S.me.isBoosting = true; });
['pointerup', 'pointercancel'].forEach((ev) => bb.addEventListener(ev, () => { if (S.me) S.me.isBoosting = false; }));

const zone = $('zoneL'), base = $('joyBase'), knob = $('joyKnob');
const homeJoy = () => ({ x: Math.max(80, innerWidth * 0.12), y: innerHeight - Math.max(80, innerHeight * 0.22) });
let joyC = homeJoy(), joyId = null;
function placeJoy() { base.style.left = joyC.x + 'px'; base.style.top = joyC.y + 'px'; }
function moveKnob(dx, dy) { const m = Math.min(Math.hypot(dx, dy), 44), a = Math.atan2(dy, dx); knob.style.transform = 'translate(' + Math.cos(a) * m + 'px,' + Math.sin(a) * m + 'px)'; }
zone.addEventListener('pointerdown', (e) => { e.preventDefault(); zone.setPointerCapture(e.pointerId); joyId = e.pointerId; joyC = { x: e.clientX, y: e.clientY }; placeJoy(); base.style.opacity = '1'; });
zone.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joyId) return;
  const dx = e.clientX - joyC.x, dy = e.clientY - joyC.y; moveKnob(dx, dy);
  if (Math.hypot(dx, dy) > 8) { const a = Math.atan2(dy, dx); S.joy = { x: Math.cos(a), y: Math.sin(a) }; }
});
['pointerup', 'pointercancel'].forEach((ev) => zone.addEventListener(ev, (e) => { if (e.pointerId !== joyId) return; joyId = null; knob.style.transform = 'translate(0,0)'; joyC = homeJoy(); placeJoy(); base.style.opacity = '0.6'; }));
base.style.opacity = '0.6'; placeJoy();

$('lbToggle').onclick = () => {
  S.lbOpen = !S.lbOpen; $('lbPanel').classList.toggle('open', S.lbOpen); $('lbToggle').setAttribute('aria-expanded', String(S.lbOpen));
  if (S.lbOpen) refreshHud();
};

function resize() {
  S.W = innerWidth; S.H = innerHeight; S.scale = Math.min(window.devicePixelRatio || 1, 2);
  S.Z = Math.max(0.6, Math.min(1, S.H / 640));
  canvas.width = Math.round(S.W * S.scale); canvas.height = Math.round(S.H * S.scale);
  if (joyId === null) { joyC = homeJoy(); placeJoy(); }
}
window.addEventListener('resize', resize);

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  const W = S.W, H = S.H, Z = S.Z, vw = W / Z, vh = H / Z, cx = S.cam.x, cy = S.cam.y;
  ctx.setTransform(S.scale, 0, 0, S.scale, 0, 0);
  ctx.fillStyle = MAP.bg; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S.scale * Z, 0, 0, S.scale * Z, 0, 0);
  ctx.strokeStyle = MAP.grid; ctx.lineWidth = 0.5; ctx.beginPath();
  const GS = 60;
  for (let x = -((cx % GS + GS) % GS); x < vw; x += GS) { ctx.moveTo(x, 0); ctx.lineTo(x, vh); }
  for (let y = -((cy % GS + GS) % GS); y < vh; y += GS) { ctx.moveTo(0, y); ctx.lineTo(vw, y); }
  ctx.stroke();
  ctx.strokeStyle = MAP.accent + '77'; ctx.lineWidth = 4; ctx.strokeRect(-cx, -cy, GAME_W, GAME_H);

  S.particles.forEach((p) => { ctx.globalAlpha = Math.max(0, p.life / 45); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x - cx, p.y - cy, p.size, 0, 6.28); ctx.fill(); });
  ctx.globalAlpha = 1;

  const drawFood = (f) => {
    const sx = f.x - cx, sy = f.y - cy; if (sx < -15 || sx > vw + 15 || sy < -15 || sy > vh + 15) return;
    const r = f.r * (Math.sin(f.pulse) * 0.22 + 1);
    ctx.fillStyle = f.color + '40'; ctx.beginPath(); ctx.arc(sx, sy, r + 4, 0, 6.28); ctx.fill();
    ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.28); ctx.fill();
  };
  S.food.forEach(drawFood); S.drops.forEach(drawFood);

  allSnakes().forEach((sn) => {
    if (!sn.alive || !sn.body.length) return;
    const skin = SKINS[sn.skin % SKINS.length], n = sn.body.length, stride = n > 800 ? 3 : 2;
    const blink = sn.kind === 'me' && sn.immunity > 0 && Math.floor(S.frame / 6) % 2 === 0;
    ctx.globalAlpha = blink ? 0.45 : 1;
    for (let i = n - 1; i >= 0; i -= stride) {
      const seg = sn.body[i], sx = seg.x - cx, sy = seg.y - cy;
      if (sx < -35 || sx > vw + 35 || sy < -35 || sy > vh + 35) continue;
      const t = i / n, ssz = SEG * (1 - t * 0.28), ci = Math.floor(t * (skin.length - 1));
      ctx.fillStyle = skin[ci]; ctx.beginPath(); ctx.arc(sx, sy, ssz, 0, 6.28); ctx.fill();
      if (i % 8 === 0) { ctx.fillStyle = skin[Math.min(ci + 1, skin.length - 1)]; ctx.beginPath(); ctx.arc(sx, sy, ssz * 0.55, 0, 6.28); ctx.fill(); }
    }
    const hd = sn.body[0], hx = hd.x - cx, hy = hd.y - cy, ang = Math.atan2(sn.dir.y, sn.dir.x);
    ctx.fillStyle = skin[0]; ctx.beginPath(); ctx.arc(hx, hy, SEG, 0, 6.28); ctx.fill();
    const ep = SEG * 0.4, es = SEG * 0.34, px = -Math.sin(ang) * ep, py = Math.cos(ang) * ep;
    for (const o of [[px, py], [-px, -py]]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + o[0], hy + o[1], es, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(hx + o[0] + Math.cos(ang) * 2, hy + o[1] + Math.sin(ang) * 2, es * 0.5, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (hx > -60 && hx < vw + 60 && hy > -60 && hy < vh + 60) {
      ctx.font = 'bold ' + (sn.kind === 'bot' ? 10 : 12) + 'px Segoe UI, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      const label = sn.name + ' ' + Math.floor(sn.length);
      ctx.strokeText(label, hx, hy - SEG - 4);
      ctx.fillStyle = sn.kind === 'me' ? MAP.accent : sn.kind === 'peer' ? '#ffffff' : 'rgba(255,255,255,0.55)';
      ctx.fillText(label, hx, hy - SEG - 4);
    }
  });
  ctx.textBaseline = 'alphabetic';
}

// ── Loop: fixed 60 Hz simulation, wall-clock timer ───────────────────────────
function tick() {
  S.frame++;
  updateMe();
  if (isHost()) hostBots();
  updateRemotes();
  S.particles = S.particles.filter((p) => { p.x += p.vx; p.y += p.vy; p.life--; p.vx *= 0.94; p.vy *= 0.94; return p.life > 0; });
  S.food.forEach((f) => { f.pulse += 0.1; });
  const me = S.me;
  if (me.alive) {
    S.cam.x += (me.body[0].x - S.W / S.Z / 2 - S.cam.x) * 0.1; S.cam.y += (me.body[0].y - S.H / S.Z / 2 - S.cam.y) * 0.1;
  }
  $('boostFill').style.width = me.boostEnergy + '%';
}
let last = performance.now(), acc = 0, lastTimer = '';
function loop(ts) {
  if (!S.running) return;
  acc += Math.min(ts - last, 100); last = ts;
  while (acc >= TICK_MS) { tick(); acc -= TICK_MS; }
  const remaining = RE - now();
  if (remaining <= 0) { endRound(); return; }
  const secs = Math.ceil(remaining / 1000), txt = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
  if (txt !== lastTimer) { lastTimer = txt; $('timerVal').textContent = txt; $('timer').classList.toggle('urgent', secs <= 30); }
  broadcast(false);
  if (Date.now() - S.lastHud > 250) { S.lastHud = Date.now(); refreshHud(); }
  render();
  requestAnimationFrame(loop);
}

// ── Start ────────────────────────────────────────────────────────────────────
function start() {
  resize();
  for (let i = 0; i < FOOD_TOTAL; i++) S.food.push(makeFood(i, 0));
  respawnMe(false);
  S.me.immunity = 150;
  S.lbOpen = innerWidth >= 900 && innerHeight >= 600;
  $('lbPanel').classList.toggle('open', S.lbOpen); $('lbToggle').setAttribute('aria-expanded', String(S.lbOpen));
  S.mouse.x = S.W / 2; S.mouse.y = S.H / 2;
  $('note').textContent = 'Live round: ' + MINUTES + ' min for everyone. Longest snake wins.';
  setTimeout(() => $('note').classList.add('hide'), 6000);
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => undefined);
  hello(); const helloTimer = setInterval(() => { if (netReady) clearInterval(helloTimer); else hello(); }, 1000);
  refreshHud();
  requestAnimationFrame((ts) => { last = ts; loop(ts); });
}
start();
</script>
</body>
