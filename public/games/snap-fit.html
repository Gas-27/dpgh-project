<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snap Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --ink:#0a1124; --panel:#14203f; --line:#243461; --text:#eef2ff; --mute:#8d9bc7;
  --orange:#f39a2b; --orange-d:#c9721a; --card:#ffffff; --card-ink:#101a33;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--text); font-family:var(--body); font-weight:700;
  padding-block:6px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
.app{height:100%; max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:8px; min-height:0}
.top{display:grid; grid-template-columns:84px 1fr 84px; align-items:center; gap:8px}
.top h1{margin:0; text-align:center; font:600 20px/1 var(--display); letter-spacing:.2px}
.top h1 span{color:var(--orange)}
.chip{justify-self:start; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:999px; height:28px; padding:0 12px; font:700 12px var(--body); cursor:pointer; white-space:nowrap}
.chip:focus-visible,.act:focus-visible,.btn:focus-visible{outline:3px solid #fff; outline-offset:2px}
.pts{justify-self:end; background:#3a2a14; color:var(--orange); border-radius:999px; padding:5px 10px; font:700 12px var(--body); font-variant-numeric:tabular-nums; white-space:nowrap}
.prog{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center}
.segs{display:flex; gap:3px}
.segs i{flex:1; height:4px; border-radius:3px; background:var(--line)}
.segs i.done{background:var(--orange)} .segs i.cur{background:linear-gradient(90deg,var(--orange) 50%,var(--line) 50%)}
.tries{display:flex; gap:5px; grid-row:1/3; grid-column:2}
.tries i{width:11px; height:11px; border-radius:50%; background:#fff; transition:background .2s,transform .2s}
.tries i.off{background:var(--line); transform:scale(.8)}
.lvl{font-size:11px; color:var(--mute); text-align:center}
.field{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
canvas{display:block; border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,.45); touch-action:manipulation; cursor:pointer}
.banner{position:absolute; top:3%; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none; opacity:0; width:92%}
.banner.show{animation:bn 3s ease both}
.banner .row{display:flex; align-items:center; gap:8px; background:rgba(8,14,32,.8); padding:5px 12px 5px 6px; border-radius:999px; backdrop-filter:blur(4px)}
.banner b{background:var(--orange); color:#2a1700; border-radius:999px; padding:2px 8px; font:700 11px var(--body); letter-spacing:.6px}
.banner em{font:600 13px var(--display); font-style:normal}
.banner p{margin:0; font-size:12px; color:#fff; background:rgba(8,14,32,.72); padding:4px 10px; border-radius:10px; text-align:center; text-wrap:balance}
.banner p.tw{background:rgba(243,154,43,.95); color:#2a1700; font-weight:800}
.banner p.loc{background:rgba(255,255,255,.92); color:#14203f; font-weight:800}
@keyframes bn{0%{opacity:0; transform:translate(-50%,-10px)}10%,84%{opacity:1; transform:translate(-50%,0)}100%{opacity:0}}
.act{border:0; border-radius:999px; height:54px; font:600 20px var(--display); color:#2a1700; cursor:pointer; background:linear-gradient(#ffb14a,var(--orange)); box-shadow:0 4px 0 var(--orange-d),0 8px 18px rgba(243,154,43,.25)}
.act:active{transform:translateY(3px); box-shadow:0 1px 0 var(--orange-d)}
.foot{display:flex; justify-content:space-between; gap:8px; font-size:10px; color:var(--mute); padding-bottom:2px}
.card{position:absolute; inset:0; margin:auto; width:min(86%,330px); height:fit-content; background:var(--card); color:var(--card-ink); border-radius:18px; padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.5); display:flex; flex-direction:column; gap:10px; animation:pop .3s ease both}
.card[hidden]{display:none}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.96)}}
.card .k{font-size:9px; letter-spacing:1px; color:#e07b00; text-transform:uppercase}
.card h2{margin:0; font:600 22px/1.1 var(--display)}
.card .big{font:700 42px/1 var(--display); text-align:center; font-variant-numeric:tabular-nums}
.card .sub{font-size:10px; text-align:center; color:#6b7899; letter-spacing:1px}
.card ul{margin:0; padding-left:18px; font-size:13px; line-height:1.5; font-weight:700}
.stars{display:flex; justify-content:center; gap:6px; font:700 40px/1 var(--display)}
.stars span{color:#dfe5f2} .stars span.on{color:#ffb703; animation:st .5s ease both}
.stars span:nth-child(2){animation-delay:.15s} .stars span:nth-child(3){animation-delay:.3s}
@keyframes st{0%{transform:scale(.2) rotate(-40deg); opacity:0}70%{transform:scale(1.25)}100%{transform:none; opacity:1}}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.stats div{background:#eef2fb; border-radius:8px; padding:7px 4px; text-align:center; font:700 15px var(--display); font-variant-numeric:tabular-nums}
.stats small{display:block; font:700 9px var(--body); color:#6b7899}
.btns{display:grid; grid-template-columns:1fr 1.3fr; gap:8px}
.btn{border:0; border-radius:12px; height:42px; font:600 15px var(--display); cursor:pointer; background:#e8edf8; color:var(--card-ink)}
.btn.go{background:linear-gradient(#ffb14a,var(--orange)); color:#2a1700; box-shadow:0 3px 0 var(--orange-d)}
.btn.solo{grid-column:1/-1}
.tip{font-size:10px; text-align:center; color:#6b7899; font-weight:600}
@media (prefers-reduced-motion:reduce){.banner.show{animation:none; opacity:1}.card,.stars span.on{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="chip" id="snd" type="button" aria-pressed="true">Sound on</button>
    <h1>Snap <span>Fit</span></h1>
    <div class="pts"><span id="pts">0</span> pts</div>
  </header>
  <div class="prog">
    <div class="segs" id="segs"></div>
    <div class="tries" id="tries" aria-label="Tries left"><i></i><i></i></div>
    <div class="lvl" id="lvlTxt">1/20</div>
  </div>
  <div class="field" id="field">
    <canvas id="cv" aria-label="Game field"></canvas>
    <div class="banner" id="banner"></div>
    <div class="card" id="card"></div>
  </div>
  <button class="act" id="actBtn" type="button">Tap</button>
  <div class="foot"><span id="best">Best: 0 pts · level 1</span><span>Tap the field or press Space</span></div>
</div>
<script>
(()=>{'use strict';
const W=360,H=560,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tri=p=>{p%=2;if(p<0)p+=2;return p<1?p:2-p};
function lin(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));return g}
function rad(c,x,y,r0,r1,st){const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));return g}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function angDiff(a,b){let d=(a-b)%TAU;if(d<-Math.PI)d+=TAU;if(d>Math.PI)d-=TAU;return Math.abs(d)}
const RC=(c,x,y,w,h,f)=>{c.fillStyle=f;c.fillRect(x,y,w,h)};
const CI=(c,x,y,r,f)=>{c.fillStyle=f;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()};
function poly(c,pts,f){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=f;c.fill()}
function starPath(c,x,y,r,n,inner){c.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,q=i%2?r*(inner||.45):r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath()}
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s*1.1,y-s*.4,x-s*.5,y-s*1.0,x,y-s*.4);c.bezierCurveTo(x+s*.5,y-s*1.0,x+s*1.1,y-s*.4,x,y+s*.35);c.closePath()}
function glow(c,x,y,r,rgb,a){c.fillStyle=rad(c,x,y,0,r,['rgba('+rgb+','+a+')','rgba('+rgb+',0)']);c.fillRect(x-r,y-r,2*r,2*r)}

/* ================= SCENES: 20 hand-drawn worlds, one per level ================= */
function sky(c,st,y1){c.fillStyle=lin(c,0,0,0,y1||H,st);c.fillRect(0,0,W,y1||H)}
function hills(c,col,base,amp,f,ph){c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=6)c.lineTo(x,base+Math.sin(x*f+ph)*amp);c.lineTo(W,H);c.closePath();c.fill()}
function blobs(c,r,n,y0,y1,col,s){c.fillStyle=col;for(let i=0;i<n;i++){const x=r()*W,y=y0+r()*(y1-y0),k=s*(.6+r()*.8);[[0,0,1],[.9,.2,.7],[-.9,.2,.7],[.3,-.45,.8]].forEach(([dx,dy,q])=>{c.beginPath();c.arc(x+dx*k,y+dy*k,q*k,0,TAU);c.fill()})}}
function stars(c,r,n,y1){for(let i=0;i<n;i++){c.fillStyle='rgba(255,255,255,'+(.3+r()*.7)+')';c.beginPath();c.arc(r()*W,r()*y1,.4+r()*1.3,0,TAU);c.fill()}}
function wood(c,y,h,c1,c2,r){c.fillStyle=lin(c,0,y,0,y+h,[c1,c2]);c.fillRect(0,y,W,h);c.strokeStyle='rgba(0,0,0,.13)';c.lineWidth=1;
  for(let i=0;i<9;i++){const yy=y+6+r()*(h-8);c.beginPath();c.moveTo(0,yy);c.bezierCurveTo(120,yy+r()*6-3,240,yy+r()*6-3,W,yy);c.stroke()}RC(c,0,y,W,3,'rgba(255,255,255,.28)')}
function tree(c,x,y,s){RC(c,x-5*s,y-60*s,10*s,60*s,'#7a4a2a');[[0,-80,30],[-20,-64,22],[20,-64,22],[0,-100,20]].forEach(([dx,dy,q],i)=>CI(c,x+dx*s,y+dy*s,q*s,i%2?'#3f8f3f':'#4fa64a'))}
function branch(c,x,y,len,ang,d){if(d<=0)return;const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;c.lineWidth=d*2.2;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();branch(c,x2,y2,len*.68,ang-.5,d-1);branch(c,x2,y2,len*.66,ang+.42,d-1)}
function stalk(c,x,w,f,node){c.fillStyle=f;c.fillRect(x-w/2,0,w,H);c.fillStyle=node;for(let y=20+((x*7)%40);y<H;y+=58)c.fillRect(x-w/2-1,y,w+2,3)}
function bat(c,x,y,s){c.fillStyle='#0b0614';c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x-8*s,y-8*s,x-16*s,y-2*s);c.quadraticCurveTo(x-10*s,y,x-8*s,y+4*s);c.quadraticCurveTo(x-4*s,y+1*s,x,y+5*s);c.quadraticCurveTo(x+4*s,y+1*s,x+8*s,y+4*s);c.quadraticCurveTo(x+10*s,y,x+16*s,y-2*s);c.quadraticCurveTo(x+8*s,y-8*s,x,y);c.fill()}

const SCENES=[
{name:'Picnic park',amb:{k:'leaf',c:['#7bd88f','#ffd166','#ff8fa3']},draw(c,r){
  sky(c,['#6ec3ff','#b9e4ff','#effaff'],430);glow(c,300,70,90,'255,250,200',.8);CI(c,300,70,28,'#fff6c2');
  blobs(c,r,4,40,150,'rgba(255,255,255,.92)',18);hills(c,'#9fd98a',395,16,.017,1);hills(c,'#6cc068',428,10,.028,3);
  tree(c,26,430,1.1);tree(c,340,420,.9);
  const q=(u,v)=>[(40-60*v)+(280+120*v)*u,468+92*v];
  for(let i=0;i<8;i++)for(let j=0;j<4;j++)poly(c,[q(i/8,j/4),q((i+1)/8,j/4),q((i+1)/8,(j+1)/4),q(i/8,(j+1)/4)],(i+j)%2?'#fff4ea':'#e63946');
  for(let i=0;i<16;i++){const x=r()*W,y=436+r()*26;CI(c,x,y,3,['#fff','#ffd166','#ff8fa3'][i%3]);CI(c,x,y,1.2,'#ffb703')}}},
{name:'Comic pop',amb:{k:'rect',c:['#ff5d5d','#4cc9f0','#ffffff']},draw(c,r){
  RC(c,0,0,W,H,'#ffd23f');for(let i=0;i<28;i+=2){const a0=i*TAU/28,a1=(i+1)*TAU/28;poly(c,[[180,190],[180+Math.cos(a0)*800,190+Math.sin(a0)*800],[180+Math.cos(a1)*800,190+Math.sin(a1)*800]],'#ffbe0b')}
  for(let y=0;y<H;y+=14)for(let x=0;x<W;x+=14){const d=Math.min(Math.hypot(x,H-y),Math.hypot(W-x,y))/250,q=Math.max(0,4.8*(1-d));if(q>.3)CI(c,x+((y/14|0)%2?7:0),y,q,'rgba(230,57,70,.55)')}
  starPath(c,72,482,60,14,.68);c.fillStyle='#fff';c.fill();c.lineWidth=3;c.strokeStyle='#14141f';c.stroke();
  c.save();c.translate(72,490);c.rotate(-.15);c.font='700 30px Fredoka,sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle='#14141f';c.strokeText('POP!',0,0);c.fillStyle='#e63946';c.fillText('POP!',0,0);c.restore();
  c.fillStyle='#fff';c.beginPath();c.ellipse(292,58,52,26,0,0,TAU);c.fill();poly(c,[[276,78],[262,104],[296,82]],'#fff');c.lineWidth=2.5;c.strokeStyle='#14141f';c.beginPath();c.ellipse(292,58,52,26,0,0,TAU);c.stroke();
  c.font='700 18px Fredoka,sans-serif';c.textAlign='center';c.fillStyle='#14141f';c.fillText('WINK!',292,65);c.textAlign='start'}},
{name:'Circus tent',amb:{k:'rect',c:['#ffd166','#ff5d8f','#4cc9f0','#ffffff']},draw(c,r){
  for(let i=-10;i<10;i++)poly(c,[[180,-80],[180+i*46,H],[180+(i+1)*46,H]],(i+20)%2?'#d62839':'#fff1e0');
  c.fillStyle=lin(c,0,0,0,H,['rgba(40,0,10,.55)','rgba(40,0,10,0)','rgba(40,0,10,.3)']);c.fillRect(0,0,W,H);
  poly(c,[[20,-10],[70,-10],[220,H],[80,H]],'rgba(255,240,180,.13)');poly(c,[[290,-10],[340,-10],[280,H],[140,H]],'rgba(255,240,180,.13)');
  [[30,40],[64,30]].forEach(([y0,sag],k)=>{c.strokeStyle='#5a3a1a';c.lineWidth=1.5;c.beginPath();c.moveTo(0,y0);c.quadraticCurveTo(180,y0+sag*2,W,y0);c.stroke();
    for(let i=1;i<14;i++){const t=i/14,x=t*W,y=y0+sag*2*2*t*(1-t);poly(c,[[x-8,y],[x+8,y],[x,y+16]],['#ffd166','#4cc9f0','#7bd88f','#ff5d8f'][(i+k)%4])}});
  c.fillStyle='#c0392b';c.beginPath();c.ellipse(180,552,240,74,0,0,TAU);c.fill();c.fillStyle='#e9c08a';c.beginPath();c.ellipse(180,558,222,62,0,0,TAU);c.fill();
  for(let i=0;i<70;i++)CI(c,180+(r()-.5)*400,510+r()*50,1.2,'rgba(150,90,30,.5)')}},
{name:'Sewing room',amb:{k:'dust',c:['#ffffff']},draw(c,r){
  RC(c,0,0,W,H,'#ffe1ea');for(let y=12;y<470;y+=34)for(let x=12;x<W;x+=34){const ox=((y/34|0)%2)?17:0;for(let k=0;k<5;k++){const a=k*TAU/5;CI(c,x+ox+Math.cos(a)*3.4,y+Math.sin(a)*3.4,2.6,'#ffc2d4')}CI(c,x+ox,y,1.6,'#ffd166')}
  RC(c,212,98,148,8,'#a86b3c');[[234,'#e63946'],[266,'#2b6cff'],[298,'#2fbf55'],[330,'#ffb703']].forEach(([x,col])=>{RC(c,x-9,64,18,34,col);c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=1;for(let y=68;y<96;y+=4){c.beginPath();c.moveTo(x-9,y);c.lineTo(x+9,y);c.stroke()}RC(c,x-12,60,24,6,'#e8c99a');RC(c,x-12,94,24,5,'#e8c99a')});
  wood(c,470,90,'#c98a55','#8f5a32',r);
  c.save();c.translate(-6,510);c.rotate(-.04);RC(c,0,0,W+30,14,'#ffd23f');c.fillStyle='#5a4300';for(let x=4;x<W+30;x+=8)c.fillRect(x,0,1,x%40<8?8:4);c.restore();
  CI(c,312,470,24,'#e63946');c.strokeStyle='rgba(120,0,20,.35)';c.lineWidth=1.5;for(let k=0;k<4;k++){c.beginPath();c.ellipse(312,470,24-k*5,24,0,0,TAU);c.stroke()}
  [[300,446,'#4cc9f0'],[316,440,'#ffd166'],[328,450,'#7bd88f']].forEach(([x,y,col])=>{c.strokeStyle='#aab';c.lineWidth=1.4;c.beginPath();c.moveTo(x,y);c.lineTo(x+3,y+18);c.stroke();CI(c,x,y,3.2,col)})}},
{name:'Classroom',amb:{k:'dust',c:['#ffffff']},draw(c,r){
  RC(c,0,0,W,H,'#f1e3c4');RC(c,16,32,328,304,'#8b5a2b');RC(c,26,42,308,284,'#2f5d46');
  for(let i=0;i<7;i++){c.fillStyle='rgba(255,255,255,.05)';c.beginPath();c.ellipse(40+r()*280,60+r()*240,30+r()*40,10+r()*14,r()*3,0,TAU);c.fill()}
  c.fillStyle='rgba(255,255,255,.62)';c.font='600 20px Fredoka,sans-serif';c.fillText('2 + 2 = 4',42,80);c.fillText('A B C',254,82);c.font='600 15px Fredoka,sans-serif';c.fillText('a² + b² = c²',220,310);
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;starPath(c,62,288,16,5);c.stroke();c.beginPath();c.arc(300,236,16,0,TAU);c.stroke();c.beginPath();c.arc(300,240,8,.3,Math.PI-.3);c.stroke();CI(c,294,231,2,'rgba(255,255,255,.6)');CI(c,306,231,2,'rgba(255,255,255,.6)');
  RC(c,26,326,308,8,'#a8743f');RC(c,60,322,16,5,'#fff');RC(c,90,323,10,4,'#ffd6e7');
  wood(c,472,88,'#d4a373','#a0703f',r);CI(c,314,462,14,'#e63946');CI(c,309,457,4,'rgba(255,255,255,.4)');c.strokeStyle='#5a3a1a';c.lineWidth=2;c.beginPath();c.moveTo(314,449);c.lineTo(316,441);c.stroke();c.fillStyle='#2fbf55';c.beginPath();c.ellipse(322,443,7,3,-.4,0,TAU);c.fill();
  RC(c,26,452,70,10,'#2b6cff');RC(c,30,442,62,10,'#e63946');RC(c,24,432,66,10,'#ffb703')}},
{name:'Sunny beach',amb:{k:'sparkle',c:['#ffffff']},draw(c,r){

function setAmb(){amb.length=0;const a=SCENES[lv.scene].amb;if(!a)return;for(let k=0;k<26;k++)amb.push({x:Math.random()*W,y:Math.random()*H,ph:Math.random()*6.3,s:.6+Math.random()*1.2,c:a.c[k%a.c.length],k:a.k})}

  if(k==='leaf'||k==='petal'){p.y+=(20+p.s*14)*dt;p.x+=(12+Math.sin(time*1.3+p.ph)*20)*dt;p.ph+=dt*2}
  else if(k==='rect'){p.y+=(24+p.s*16)*dt;p.ph+=dt*3}
  else if(k==='dust'){p.y-=(4+p.s*4)*dt;p.x+=Math.sin(time*.6+p.ph)*8*dt}
  else if(k==='steam'){p.y-=(18+p.s*10)*dt;p.x+=Math.sin(time+p.ph)*10*dt}
  else if(k==='fly'){p.x+=Math.sin(time*.7+p.ph)*16*dt;p.y+=Math.cos(time*.9+p.ph*2)*12*dt}
  if(p.y>H)p.y-=H;if(p.y<0)p.y+=H;if(p.x>W)p.x-=W;if(p.x<0)p.x+=W}}

/* ================= action + resolve ================= */
function newAttempt(){phi=Math.random()*2;dir=Math.random()<.5?1:-1;revT=.8+Math.random();a0=Math.random()*TAU;tPlay=Math.random()*3;locked=false;P=null;res=null;msg=null;resT=0}

  else if(t==='ball'){P={k:t,x:ballX(),y:BALL_Y,vx:0,vy:-1500};locked=true}
  else if(t==='needle'){P={k:t,x:TIP_X0,y:tipY(),vy:0,stitch:0};locked=true}

function resolve(err,q2){

    popup(180,300,'+'+gain,perfect?'#ffd24a':'#fff',26);good(perfect);

function update(dt){

  if(st==='intro'&&(resT+=dt)>.45){st='play';resT=0}
  if(shake>0)shake=Math.max(0,shake-dt*30);if(fade>0)fade=Math.max(0,fade-dt*2.6);if(flash>0)flash=Math.max(0,flash-dt*1.6);
  if(P)updateP(dt);

  if(msg)msg.t+=dt;

function updateP(dt){

  if(t==='melon'){

      if(P.t>=d){P.done=true;const ae=angDiff(melonA(),Math.PI/2)*180/Math.PI,xe=Math.abs(melonX()-180);

      else if(e<=lv.tol+14){P.falling=true;P.vx=(P.x<poleX()?-1:1)*240;P.vy=180;resolve(e)}

  if(skin==='ballpoint'){c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1;for(let i=0;i<6;i++){c.beginPath();c.moveTo(x-14,PEN_B-66+i*6);c.lineTo(x+14,PEN_B-66+i*6);c.stroke()}}
  c.fillStyle=lin(c,x-12,0,x+12,0,skin==='fountain'?gold:silver);c.beginPath();c.moveTo(x-13,PEN_B-32);c.lineTo(x+13,PEN_B-32);c.lineTo(x+5,PEN_B);c.lineTo(x-5,PEN_B);c.closePath();c.fill();
  c.fillStyle='#1a1a24';c.beginPath();c.ellipse(x,PEN_B,4,1.6,0,0,TAU);c.fill()}
function penBottom(c,x,y,skin,al,bent){c.save();c.globalAlpha=al;if(bent)c.translate(Math.sin(time*40)*1.5,0);
  if(skin==='marker'){poly(c,[[x-3,y],[x+3,y],[x+7,y+14],[x-7,y+14]],'#c8102e');RC(c,x-11,y+14,22,10,'#e8e8ee');
    c.fillStyle=lin(c,x-11,0,x+11,0,['#c5c9d4','#ffffff','#c5c9d4']);rr(c,x-11,y+24,22,REF_L-24,6);c.fill();RC(c,x-11,y+58,22,26,'#e63946');RC(c,x-11,y+88,22,3,'#e63946')}
  else{const ink=skin==='fountain'?'#1b2a6b':'#1a1a24';c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(x,y+8);if(bent)c.quadraticCurveTo(x+10,y+REF_L*.45,x,y+REF_L);else c.lineTo(x,y+REF_L);c.stroke();c.strokeStyle=ink;c.lineWidth=3.2;c.lineCap='round';c.beginPath();c.moveTo(x,y+8);if(bent)c.quadraticCurveTo(x+10,y+REF_L*.45,x,y+REF_L);else c.lineTo(x,y+REF_L);c.stroke();
    if(skin==='fountain'){poly(c,[[x-4.5,y+16],[x+4.5,y+16],[x,y]],lin(c,x-4,0,x+4,0,['#a07a10','#ffe680','#b8860b']));c.strokeStyle='#5a4300';c.lineWidth=.8;c.beginPath();c.moveTo(x,y+2);c.lineTo(x,y+12);c.stroke()}
    else poly(c,[[x-2.6,y+10],[x+2.6,y+10],[x+1,y],[x-1,y]],lin(c,x-3,0,x+3,0,['#8a94a2','#ffffff','#8a94a2']))}
  hand(c,x,y+REF_L-22,.74,0);c.restore()}

/* ================= draw each challenge ================= */
function chevron(c,x,y,dirUp,a){c.save();c.globalAlpha=a;c.strokeStyle='#fff';c.lineWidth=3;c.lineCap='round';c.beginPath();const s=dirUp?-1:1;c.moveTo(x-8,y-4*s);c.lineTo(x,y+4*s);c.lineTo(x+8,y-4*s);c.stroke();c.restore()}
function drawMelon(c){const vis=visible(),mx=melonX(),a=melonA();
  c.strokeStyle='rgba(255,255,255,.35)';c.setLineDash([4,8]);c.lineWidth=2;c.beginPath();c.moveTo(180,420);c.lineTo(180,MC.y+MR+24);c.stroke();c.setLineDash([]);
  if(!P)chevron(c,180,MC.y+MR+14,true,.45+.35*Math.sin(time*6));
  c.save();c.fillStyle='rgba(0,0,0,.15)';c.beginPath();c.ellipse(mx+6,MC.y+8,MR,MR,0,0,TAU);c.fill();c.restore();
  c.globalAlpha=vis;if(P&&P.stuck)sliceAt(c,mx,MC.y,a,0,0,true);else sliceAt(c,mx,MC.y,a,GH,TAU-GH);c.globalAlpha=1;
  if(P&&P.stuck){c.save();c.translate(mx,MC.y);c.rotate(a+P.rel);c.strokeStyle='rgba(80,0,20,.3)';c.lineWidth=1.5;c.beginPath();c.moveTo(Math.cos(-GH)*MR,Math.sin(-GH)*MR);c.lineTo(0,0);c.lineTo(Math.cos(GH)*MR,Math.sin(GH)*MR);c.stroke();c.restore()}
  if(!P)sliceAt(c,180,440,Math.PI/2,-GH,GH);else if(!P.stuck)sliceAt(c,P.x,P.y,P.rot||Math.PI/2,-GH,GH)}
function drawEmoji(c){const dl=leftDy(),dr=P?P.dy:rightDy(),vis=visible(),sk=lv.skin;
  const half=(side,dy,al)=>{c.save();c.globalAlpha=al;c.translate(EC.x+side*3,EC.y+dy);c.beginPath();c.rect(side<0?-ER-40:0,-ER-40,ER+40,2*ER+60);c.clip();face(c,sk);c.restore()};
  c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=1;c.setLineDash([3,6]);c.beginPath();c.moveTo(EC.x,40);c.lineTo(EC.x,370);c.stroke();c.setLineDash([]);
  if(!P&&vis>0){[2,1].forEach(k=>{c.save();c.globalAlpha=.1*vis/k;c.translate(EC.x+3,EC.y+ghost(rightDy,k*1.5));c.beginPath();c.rect(0,-ER-40,ER+40,2*ER+60);c.clip();face(c,sk);c.restore()})}
  if(res&&res.ok&&P.t>.25){const k=P.t-.25,s=1+.12*Math.sin(k*14)*Math.exp(-k*4);c.save();c.translate(EC.x,EC.y+dl);c.scale(s,s);face(c,sk);c.restore()}
  else{half(-1,dl,1);half(1,dr,P?1:vis)}}
function drawBall(c){const px=poleX(),sk=lv.skin;drawPole(c,px,sk);
  if(!P||!P.stuck){const a=.35+.3*Math.sin(time*6);c.strokeStyle='rgba(255,255,255,'+a+')';c.lineWidth=2;c.beginPath();c.arc(px,POLE_B+BR,BR+5,0,TAU);c.stroke()}
  c.strokeStyle='rgba(255,255,255,.35)';c.setLineDash([4,8]);c.lineWidth=2;c.beginPath();c.moveTo(58,BALL_Y+BR+6);c.lineTo(302,BALL_Y+BR+6);c.stroke();c.setLineDash([]);
  if(P)drawBallSkin(c,P.x,P.y,1,sk);else{const v=visible();[3,2,1].forEach(k=>drawBallSkin(c,ghost(ballX,k),BALL_Y,.12*v/k,sk));drawBallSkin(c,ballX(),BALL_Y,v,sk);
    c.strokeStyle='rgba(255,255,255,'+(.2*v)+')';c.lineWidth=1;c.beginPath();c.moveTo(ballX(),BALL_Y-BR-4);c.lineTo(ballX(),POLE_B+30);c.stroke()}}
function drawNeedle(c){const sh=needleShift(),sk=NEEDLE[lv.skin];
  if(sk.glow)glow(c,NX,eyeY(),26,'94,240,255',.35+.2*Math.sin(time*5));else glow(c,NX,eyeY(),20,'255,255,255',.35+.2*Math.sin(time*5));
  needle(c,sh,sk);hand(c,NX,360+sh-26,.72,.05);
  if(P){if(P.ok){thread(c,P.x,P.y,1,0,sk);c.strokeStyle='#e9c46a';c.lineWidth=1.4;c.beginPath();c.ellipse(NX,eyeY(),3.2,11,0,Math.PI*1.1,Math.PI*1.9);c.stroke();
      c.strokeStyle=sk.th;c.lineWidth=sk.w;c.beginPath();c.moveTo(P.x,P.y);c.quadraticCurveTo(P.x-12,P.y+20,P.x-6,P.y+46);c.stroke();
      if(P.stitch>0){c.save();if(sk.glow){c.shadowColor=sk.th;c.shadowBlur=10}c.strokeStyle=sk.th;c.lineWidth=3;c.setLineDash([12,8]);c.beginPath();c.moveTo(24,522);c.lineTo(24+312*P.stitch,522);c.stroke();c.restore();c.setLineDash([])}}
    else thread(c,P.x,P.y,1,P.droop||0,sk)}
  else{const v=visible();[2,1].forEach(k=>CI(c,TIP_X0,ghost(tipY,k),sk.w,'rgba(255,255,255,'+(.25*v/k)+')'));thread(c,TIP_X0,tipY(),v,0,sk)}
  c.strokeStyle='rgba(255,255,255,.3)';c.setLineDash([3,6]);c.lineWidth=1;c.beginPath();c.moveTo(NX+14,eyeY());c.lineTo(NX+60,eyeY());c.stroke();c.setLineDash([])}
function drawPen(c){const px=penX(),sk=lv.skin;
  if(!P||!P.ok)glow(c,px,PEN_B+4,22,'255,255,255',.3+.2*Math.sin(time*6));
  if(P&&P.ok){c.save();c.beginPath();c.rect(0,PEN_B,W,H);c.clip();penBottom(c,P.x,P.y,sk,1);c.restore();penTop(c,px,sk)}
  else{penTop(c,px,sk);if(P)penBottom(c,P.x,P.y,sk,1,P.bent);else{const v=visible();[2,1].forEach(k=>{c.strokeStyle='rgba(255,255,255,'+(.18*v/k)+')';c.lineWidth=sk==='marker'?14:3;c.beginPath();const gx=ghost(refX,k);c.moveTo(gx,REF_Y0+8);c.lineTo(gx,REF_Y0+80);c.stroke()});penBottom(c,refX(),REF_Y0,sk,v);
    c.strokeStyle='rgba(255,255,255,'+(.2*v)+')';c.lineWidth=1;c.beginPath();c.moveTo(refX(),REF_Y0-6);c.lineTo(refX(),PEN_B+18);c.stroke()}}}

/* ================= lens-style ✓/✗ boxes ================= */
function drawMarks(c){for(let i=0;i<5;i++){const x=12,y=78+i*36,m=marks[i],cur=i===level%5&&st!=='over'&&st!=='menu';
  rr(c,x,y,26,26,6);
  if(m==='x'){c.fillStyle='#e8202f';c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();c.strokeStyle='#1a0006';c.lineWidth=3;c.beginPath();c.moveTo(x+8,y+8);c.lineTo(x+18,y+18);c.moveTo(x+18,y+8);c.lineTo(x+8,y+18);c.stroke()}
  else if(m){c.fillStyle=m==='p'?'#ffc933':'#3ccf6e';c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();c.strokeStyle='#123';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(x+7,y+13);c.lineTo(x+11,y+18);c.lineTo(x+19,y+8);c.stroke();c.lineCap='butt'}
  else{c.fillStyle='rgba(0,0,0,.18)';c.fill();c.strokeStyle=cur?'rgba(255,255,255,'+(.6+.4*Math.sin(time*6))+')':'rgba(255,255,255,.8)';c.lineWidth=cur?3:2;c.stroke()}}}

/* ================= render ================= */
function render(){
  const c=ctx;c.setTransform(S,0,0,S,0,0);
  c.save();if(shake>0)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  c.drawImage(sceneCanvas(lv.scene,S),0,0,W,H);drawAmb(c);
  if(lv.blink&&st!=='menu'){const v=visible();c.fillStyle='rgba(5,5,20,'+(.4*(1-v))+')';c.fillRect(0,0,W,H)}
  ({melon:drawMelon,emoji:drawEmoji,ball:drawBall,needle:drawNeedle,pen:drawPen})[lv.t](c);
  for(const g of rings){const k=g.t/.6;c.strokeStyle=g.c;c.globalAlpha=1-k;c.lineWidth=4*(1-k)+1;c.beginPath();c.arc(g.x,g.y,g.r+k*60,0,TAU);c.stroke()}c.globalAlpha=1;
  for(const p of parts){c.globalAlpha=1-p.t/p.life;c.fillStyle=p.c;c.save();c.translate(p.x,p.y);c.rotate(p.r);
    if(p.k==='heart'){heartPath(c,0,0,p.s);c.fill()}else if(p.k==='star'){starPath(c,0,0,p.s,5);c.fill()}else c.fillRect(-p.s,-p.s/2,p.s*2,p.s);c.restore()}c.globalAlpha=1;
  c.restore();
  drawMarks(c);c.textAlign='center';
  for(const p of pops){c.globalAlpha=1-p.t/1.1;c.font='700 '+p.size+'px Fredoka,sans-serif';c.fillStyle=p.color;c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=4;const y=p.y-p.t*50;c.strokeText(p.text,p.x,y);c.fillText(p.text,p.x,y)}c.globalAlpha=1;
  if(msg){const k=Math.min(1,msg.t*5),y=496;c.globalAlpha=Math.min(1,(1.35-msg.t)*4);c.font='700 '+(22+6*(1-k))+'px Fredoka,sans-serif';
    const w=Math.max(c.measureText(msg.text).width+34,110);c.fillStyle='rgba(8,14,32,.78)';rr(c,180-w/2,y-26,w,50,18);c.fill();c.fillStyle=msg.color;c.fillText(msg.text,180,y+1);
    c.font='700 11px Nunito,sans-serif';c.fillStyle='rgba(255,255,255,.75)';c.fillText(msg.sub,180,y+17);c.globalAlpha=1}
  if(st==='play'&&!P&&level===0&&tries===2){c.font='700 12px Nunito,sans-serif';c.fillStyle='rgba(255,255,255,'+(.65+.3*Math.sin(time*4))+')';c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=3;c.strokeText('Tap to '+VERB[lv.t].toLowerCase(),180,544);c.fillText('Tap to '+VERB[lv.t].toLowerCase(),180,544)}
  c.textAlign='start';
  if(flash>0){c.fillStyle='rgba(255,255,255,'+flash+')';c.fillRect(0,0,W,H)}
  if(fade>0){c.fillStyle='rgba(10,17,36,'+fade+')';c.fillRect(0,0,W,H)}
}

/* ================= flow ================= */
function introBanner(){const lines=[];if(level%5===0)lines.push([stageName()+(level<NSEG?' · stage '+(level/5+1)+' of 4':'')]);
  lines.push([lv.note]);if(lv.tw)lines.push([lv.tw,'tw']);lines.push(['Now at: '+SCENES[lv.scene].name,'loc']);banner('LEVEL '+(level+1),lv.n,lines)}
function enterLevel(){lv=getLevel(level);tries=2;newAttempt();setAmb();st='intro';resT=0;fade=.9;setHUD();introBanner()}
function startGame(){ac();level=0;pts=0;perfects=0;streak=0;stagePts=0;marks=[];$('card').hidden=true;enterLevel();fade=1}
function nextLevel(){level++;if(level%5===0){marks=[];stagePts=0}enterLevel();
  if(level===NSEG)banner('ALL 20 CLEARED','Endless mode',[['Speed climbs every level. How far can you go?','tw']])}
function retry(){newAttempt();st='intro';resT=0;fade=.5;banner('TRY AGAIN',lv.n,[[tries+(tries===1?' try':' tries')+' left.']])}
function showStage(){
  st='stage';fanfare();const p=marks.filter(m=>m==='p').length,n=p>=5?3:p>=3?2:1;const c=$('card');c.hidden=false;const last=level===NSEG-1;
  c.innerHTML='<div class="k">'+(level<NSEG?'Stage '+((level/5|0)+1)+' cleared':'Round cleared')+'</div><h2>'+(last?'You beat all 4 stages!':stageName()+' done')+'</h2>'+
   '<div class="stars">'+[0,1,2].map(i=>'<span class="'+(i<n?'on':'')+'">★</span>').join('')+'</div>'+
   '<div class="stats"><div>'+p+'/5<small>perfect</small></div><div>'+stagePts+'<small>stage pts</small></div><div>'+pts+'<small>total</small></div></div>'+
   '<div class="btns"><button class="btn go solo" id="nextBtn" type="button">'+(last?'Go endless':'Next stage')+'</button></div>'+
   '<div class="tip">'+(n<3?'Get 5 perfects in a stage for 3 stars.':'Flawless. Every piece snapped in perfectly.')+'</div>';
  burst(180,200,40,['#ffd24a','#ff5d8f','#4cc9f0','#7bd88f'],{sp:320,s:4});
  $('nextBtn').onclick=()=>{$('card').hidden=true;nextLevel()}}
function showOver(){
  st='over';const c=$('card');c.hidden=false;
  c.innerHTML='<div class="k">Out of tries</div><h2>You reached level '+(level+1)+'</h2><div><div class="big">'+pts+'</div><div class="sub">POINTS</div></div>'+
   '<div class="stats"><div>'+(level+1)+'<small>level</small></div><div>'+perfects+'<small>perfect</small></div><div>'+best.pts+'<small>best</small></div></div>'+
   '<div class="btns"><button class="btn" id="shareBtn" type="button">Share</button><button class="btn go" id="againBtn" type="button">Play again</button></div>'+
   '<div class="tip">'+({melon:'Tip: the slice takes a moment to fly. Throw a little early.',emoji:'Tip: watch the left half and stop when the mouths line up.',ball:'Tip: watch the pole, not the ball.',needle:'Tip: look at the eye and wait for the thread to cross it.',pen:'Tip: line it up under the opening before you push.'})[lv.t]+'</div>';
  $('againBtn').onclick=startGame;
  $('shareBtn').onclick=()=>{const t='I reached level '+(level+1)+' with '+pts+' pts in Snap Fit!';const b=$('shareBtn');
    try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied'},()=>{b.textContent=t})}catch(e){b.textContent='Copy failed'}}}
function showMenu(){st='menu';lv=LEVELS[0];setAmb();const c=$('card');c.hidden=false;
  c.innerHTML='<div class="k">New game</div><h2>Snap Fit</h2><ul><li>20 levels, 20 different places: picnic, circus, space, a haunted hill, a neon city and more.</li><li>Melons, pizza, emojis, aliens, basketballs, needles and pens. Each one looks different.</li><li>Tap at the right moment so the pieces fit.</li><li>2 tries per level. Clear 5 levels for a stage. Perfect hits earn stars.</li></ul><div class="btns"><button class="btn go solo" id="startBtn" type="button">Start</button></div>';
  $('startBtn').onclick=startGame}

/* ================= input + loop ================= */
cv.addEventListener('pointerdown',e=>{e.preventDefault();act()});
$('actBtn').addEventListener('click',act);
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&document.activeElement.id!=='actBtn')return;e.preventDefault();
  if(st==='menu'||st==='over')startGame();else if(st==='stage'){$('card').hidden=true;nextLevel()}else act()}});
new ResizeObserver(()=>{resize();render()}).observe(field);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}
resize();setHUD();showMenu();requestAnimationFrame(loop);
window.__sf={get st(){return st},get level(){return level},get res(){return res},act,
  jump(i){level=i;$('card').hidden=true;enterLevel();st='play';fade=0},
  aim(){const t=lv.t;return t==='melon'?angDiff(melonA()+lv.spin*dir*.3,Math.PI/2)*180/Math.PI:t==='emoji'?Math.abs(rightDy()-leftDy()):t==='ball'?Math.abs(ballX()-poleX()):t==='needle'?Math.abs(tipY()-eyeY()):Math.abs(refX()-penX())}};
})();
</script>
