<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cut & Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen portrait game. HUD on top, playfield canvas fills the middle, big Cut button below. */
:root{
  --ink:#0a1124; --panel:#14203f; --line:#243461; --text:#eef2ff; --mute:#8d9bc7;
  --orange:#f39a2b; --orange-d:#c9721a; --good:#4ade80; --bad:#ff7a7a; --card:#ffffff; --card-ink:#101a33;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--text); font-family:var(--body); font-weight:700;
  padding-block:6px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
.app{height:100%; max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:8px; min-height:0}
.top{display:grid; grid-template-columns:84px 1fr 84px; align-items:center; gap:8px}
.top h1{margin:0; text-align:center; font:600 20px/1 var(--display); letter-spacing:.2px}
.top h1 span{color:var(--orange)}
.chip{justify-self:start; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:999px; height:28px; padding:0 12px; font:700 12px var(--body); cursor:pointer}
.chip:focus-visible,.cut:focus-visible,.btn:focus-visible{outline:3px solid #fff; outline-offset:2px}
.pts{justify-self:end; background:#3a2a14; color:var(--orange); border-radius:999px; padding:5px 10px; font:700 12px var(--body); font-variant-numeric:tabular-nums; white-space:nowrap}
.prog{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center}
.segs{display:flex; gap:3px}
.segs i{flex:1; height:4px; border-radius:3px; background:var(--line)}
.segs i.done{background:var(--orange)} .segs i.cur{background:linear-gradient(90deg,var(--orange) 50%,var(--line) 50%)}
.tries{display:flex; gap:5px; grid-row:1/3; grid-column:2}
.tries i{width:11px; height:11px; border-radius:50%; background:#fff; transition:background .2s,transform .2s}
.tries i.off{background:var(--line); transform:scale(.8)}
.lvl{font-size:11px; color:var(--mute); text-align:center}
.field{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
canvas{display:block; border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,.45); touch-action:manipulation}
.banner{position:absolute; top:3%; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none; opacity:0; width:92%}
.banner.show{animation:bn 2.8s ease both}
.banner .row{display:flex; align-items:center; gap:8px; background:rgba(8,14,32,.78); padding:5px 12px 5px 6px; border-radius:999px; backdrop-filter:blur(4px)}
.banner b{background:var(--orange); color:#2a1700; border-radius:999px; padding:2px 8px; font:700 11px var(--body); letter-spacing:.6px}
.banner em{font:600 13px var(--display); font-style:normal}
.banner p{margin:0; font-size:12px; color:#fff; background:rgba(8,14,32,.7); padding:4px 10px; border-radius:10px; text-align:center; text-wrap:balance}
@keyframes bn{0%{opacity:0; transform:translate(-50%,-10px)}10%,82%{opacity:1; transform:translate(-50%,0)}100%{opacity:0}}
.cut{border:0; border-radius:999px; height:54px; font:600 20px var(--display); color:#2a1700; cursor:pointer; background:linear-gradient(#ffb14a,var(--orange)); box-shadow:0 4px 0 var(--orange-d),0 8px 18px rgba(243,154,43,.25)}
.cut:active{transform:translateY(3px); box-shadow:0 1px 0 var(--orange-d)}
.cut:disabled{opacity:.45}
.foot{display:flex; justify-content:space-between; gap:8px; font-size:10px; color:var(--mute); padding-bottom:2px}
.card{position:absolute; inset:0; margin:auto; width:min(86%,330px); height:fit-content; background:var(--card); color:var(--card-ink); border-radius:18px; padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.5); display:flex; flex-direction:column; gap:10px; animation:pop .3s ease both}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.96)}}
.card .k{font-size:9px; letter-spacing:1px; color:#e07b00; text-transform:uppercase}
.card h2{margin:0; font:600 22px/1.1 var(--display)}
.card .big{font:700 42px/1 var(--display); text-align:center; font-variant-numeric:tabular-nums}
.card .sub{font-size:10px; text-align:center; color:#6b7899; letter-spacing:1px}
.card ul{margin:0; padding-left:18px; font-size:13px; line-height:1.5; font-weight:700}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.stats div{background:#eef2fb; border-radius:8px; padding:7px 4px; text-align:center; font:700 15px var(--display); font-variant-numeric:tabular-nums}
.stats small{display:block; font:700 9px var(--body); color:#6b7899}
.btns{display:grid; grid-template-columns:1fr 1.3fr; gap:8px}
.btn{border:0; border-radius:12px; height:42px; font:600 15px var(--display); cursor:pointer; background:#e8edf8; color:var(--card-ink)}
.btn.go{background:linear-gradient(#ffb14a,var(--orange)); color:#2a1700; box-shadow:0 3px 0 var(--orange-d)}
.btn.solo{grid-column:1/-1}
.banner p.loc{background:rgba(243,154,43,.95);color:#2a1700;font-weight:800}
.card[hidden]{display:none}
.chip{white-space:nowrap}
.tip{font-size:10px; text-align:center; color:#6b7899; font-weight:600}
@media (prefers-reduced-motion:reduce){.banner.show{animation:none; opacity:1}.card{animation:none}}
</style>
<div class="app" id="app">
  <header class="top">
    <button class="chip" id="snd" type="button" aria-pressed="false">Sound on</button>
    <h1>Cut <span>&amp;</span> Score</h1>
    <div class="pts"><span id="pts">0</span> pts</div>
  </header>
  <div class="prog">
    <div class="segs" id="segs"></div>
    <div class="tries" id="tries" aria-label="Tries left"><i></i><i></i><i></i></div>
    <div class="lvl" id="lvlTxt">1/12 · First touch</div>
  </div>
  <div class="field" id="field">
    <canvas id="cv" aria-label="Game field"></canvas>
    <div class="banner" id="banner"></div>
    <div class="card" id="card"></div>
  </div>
  <button class="cut" id="cutBtn" type="button">Cut</button>
  <div class="foot"><span id="best">Best: 0 pts · level 1</span><span>Tap the field or press Space</span></div>
</div>
<script>
(()=>{'use strict';
const W=360,H=560,GROUND=372,TOP=64;
const $=id=>document.getElementById(id);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lin(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));return g}
function rad(c,x,y,r0,r1,st){const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));return g}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-clamp(t,0,1),3);
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s*1.1,y-s*.4,x-s*.5,y-s*1.0,x,y-s*.4);c.bezierCurveTo(x+s*.5,y-s*1.0,x+s*1.1,y-s*.4,x,y+s*.35);c.closePath()}
function starPath(c,x,y,r,n){c.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,rr=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()}

/* ---------- shapes: local coords, origin = top centre, x in -w..w, y in 0..h ---------- */
function shapePath(c,sh,u0,u1,n){n=n||40;c.beginPath();
  for(let i=0;i<=n;i++){const u=u0+(u1-u0)*i/n;c.lineTo(-sh.w*sh.f(u),u*sh.h)}
  for(let i=n;i>=0;i--){const u=u0+(u1-u0)*i/n;c.lineTo(sh.w*sh.f(u),u*sh.h)}
  c.closePath()}
function drawShapeLocal(c,sh){
  c.save();shapePath(c,sh,0,1);c.clip();sh.paint(c,sh,rng(sh.seed));c.restore();
  shapePath(c,sh,0,1);c.lineWidth=3;c.lineJoin='round';c.strokeStyle=sh.edge;c.stroke();
}
function inset(c,sh,px,fill){c.save();c.scale((sh.w-px)/sh.w,(sh.h-px)/sh.h);shapePath(c,sh,0,1);c.fillStyle=fill;c.fill();c.restore()}
function gloss(c,x,y,rx,ry,rot,a){c.save();c.translate(x,y);c.rotate(rot);c.fillStyle='rgba(255,255,255,'+a+')';c.beginPath();c.ellipse(0,0,rx,ry,0,0,6.3);c.fill();c.restore()}

const SHAPES=[
{id:'melon',w:50,h:170,seed:3,edge:'#2fbf55',juice:['#ff4d6d','#2fbf55','#ff8fa3'],
 f:u=>u<.58?1:Math.sqrt(Math.max(0,1-((u-.58)/.42)**2)),
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=lin(c,-w,0,w,0,['#1f7a35','#46c25f','#1f7a35']);c.fillRect(-w-2,-2,2*w+4,h+4);
  inset(c,sh,7,'#d9f2b4');inset(c,sh,11,rad(c,0,h*.5,4,h*.9,['#ff7a88','#ff3d57','#d91f3f']));
  for(let i=0;i<11;i++){const x=(r()-.5)*(w*1.3),y=14+r()*(h-44);c.save();c.translate(x,y);c.rotate(r()*3);c.fillStyle='#1b1b1b';c.beginPath();c.ellipse(0,0,2.6,5,0,0,6.3);c.fill();c.restore()}
  gloss(c,-w*.5,h*.35,6,h*.22,.1,.18)}},
{id:'carrot',w:44,h:185,seed:5,edge:'#a63d00',juice:['#ff8a1f','#ffb366'],
 f:u=>Math.pow(1-u,.8),
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=lin(c,-w,0,w,0,['#cf4c05','#ff9a2e','#ff7a12','#c04604']);c.fillRect(-w,0,2*w,h);
  c.strokeStyle='rgba(110,35,0,.4)';c.lineWidth=2.2;c.lineCap='round';
  for(let i=0;i<9;i++){const y=12+r()*(h-30),x=(r()-.5)*w*.9;c.beginPath();c.moveTo(x-9,y);c.quadraticCurveTo(x,y+4,x+9,y);c.stroke()}
  gloss(c,-w*.4,h*.28,5,h*.2,0,.22)}},
{id:'cone',w:46,h:180,seed:7,edge:'#a8742f',juice:['#ff7eb6','#f0b865','#fff'],
 f:u=>u<.32?.98*Math.sqrt(Math.max(0,1-((.32-u)/.32)**2)):.86*(1-(u-.32)/.68),
 paint(c,sh,r){const{w,h}=sh;c.fillStyle='#f0b865';c.fillRect(-w,0,2*w,h);
  c.strokeStyle='#c78a3a';c.lineWidth=1.6;c.beginPath();
  for(let i=-12;i<12;i++){c.moveTo(i*14,.3*h);c.lineTo(i*14+.75*h,h);c.moveTo(i*14,.3*h);c.lineTo(i*14-.75*h,h)}c.stroke();
  c.fillStyle=lin(c,0,0,0,.34*h,['#ffb3d4','#ff6fae']);c.beginPath();c.moveTo(-w,0);c.lineTo(w,0);c.lineTo(w,.31*h);
  for(let x=w;x>=-w;x-=3){c.lineTo(x,.31*h+Math.sin(x*.28)*5+(Math.abs(x-12)<6?8:0))}c.closePath();c.fill();
  const cols=['#fff','#7ae0ff','#ffe066','#9be564'];for(let i=0;i<9;i++){c.save();c.translate((r()-.5)*w*1.5,8+r()*.2*h);c.rotate(r()*3);c.fillStyle=cols[i%4];c.fillRect(-3,-1,6,2.4);c.restore()}}},
{id:'rocket',w:40,h:175,seed:9,edge:'#7d8bb0',juice:['#ffffff','#ff4d4d','#9fb4ff'],
 f:u=>u<.55?1:Math.pow(Math.max(0,1-(u-.55)/.45),.7),
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=lin(c,-w,0,w,0,['#aab6d6','#ffffff','#9aa8cc']);c.fillRect(-w,0,2*w,h);
  c.fillStyle=lin(c,-w,0,w,0,['#a30f1c','#ff5252','#a30f1c']);c.fillRect(-w,.55*h,2*w,.5*h);
  c.fillStyle='#3a86ff';c.fillRect(-w,.07*h,2*w,.07*h);c.fillRect(-w,.17*h,2*w,.025*h);
  c.fillStyle='#102a54';c.beginPath();c.arc(0,.33*h,13,0,6.3);c.fill();c.lineWidth=3;c.strokeStyle='#8fa3c7';c.stroke();
  c.fillStyle='#6ec6ff';c.beginPath();c.arc(-3,.33*h-3,6,0,6.3);c.fill()}},
{id:'gem',w:54,h:160,seed:11,edge:'#0e3a8c',juice:['#6be3ff','#ffffff','#4f8cff'],
 f:u=>u<.22?.72+.28*(u/.22):1-(u-.22)/.78,
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=lin(c,0,0,0,h,['#9ff4ff','#2d9cdb','#1b4fb0']);c.fillRect(-w,0,2*w,h);
  const y=.22*h;c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.moveTo(-w,y);c.lineTo(-w*.55,y);c.lineTo(0,h);c.closePath();c.fill();
  c.fillStyle='rgba(0,20,80,.22)';c.beginPath();c.moveTo(w,y);c.lineTo(w*.55,y);c.lineTo(0,h);c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,.65)';c.lineWidth=1.6;c.beginPath();c.moveTo(-w,y);c.lineTo(w,y);c.moveTo(-w*.55,y);c.lineTo(0,h);c.moveTo(w*.55,y);c.lineTo(0,h);c.moveTo(-w*.55,y);c.lineTo(-w*.3,0);c.moveTo(w*.55,y);c.lineTo(w*.3,0);c.moveTo(0,y);c.lineTo(0,h);c.stroke();
  c.fillStyle='#fff';starPath(c,-w*.45,.1*h,7,4);c.fill()}},
{id:'pizza',w:56,h:170,seed:13,edge:'#a05a1a',juice:['#ffd23f','#c8302a','#7bd88f'],
 f:u=>Math.max(0,1-u),
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=rad(c,0,h*.3,5,h,['#ffe680','#ffc233']);c.fillRect(-w,0,2*w,h);
  c.fillStyle=lin(c,0,0,0,.15*h,['#e8a050','#c97a2a']);c.fillRect(-w,0,2*w,.15*h);
  [[-.35,.3,11],[.3,.36,10],[-.08,.52,9],[.08,.72,7],[-.4,.12,0],[.45,.18,0]].forEach(([x,y,rr])=>{if(!rr)return;c.fillStyle='#c8302a';c.beginPath();c.arc(x*w,y*h,rr,0,6.3);c.fill();c.fillStyle='#e24a3f';c.beginPath();c.arc(x*w-2,y*h-2,rr*.55,0,6.3);c.fill()});
  c.fillStyle='#3fae5a';for(let i=0;i<5;i++){c.save();c.translate((r()-.5)*w*1.1,.25*h+r()*.4*h);c.rotate(r()*3);c.beginPath();c.ellipse(0,0,5,2.5,0,0,6.3);c.fill();c.restore()}}},
{id:'pine',w:44,h:175,seed:15,edge:'#8a5a00',juice:['#ffd93b','#d79a00','#7bd88f'],
 f:u=>Math.pow(Math.sqrt(Math.max(0,1-((u-.5)/.5)**2)),.7),
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=lin(c,-w,0,w,0,['#c98d00','#ffd93b','#e7a900','#b87d00']);c.fillRect(-w,0,2*w,h);
  c.strokeStyle='#a86f00';c.lineWidth=2;c.beginPath();for(let i=-14;i<14;i++){c.moveTo(i*18,0);c.lineTo(i*18+h*.9,h);c.moveTo(i*18,0);c.lineTo(i*18-h*.9,h)}c.stroke();
  c.fillStyle='#7a4b00';for(let y=9;y<h;y+=18)for(let x=-w;x<w;x+=18){c.beginPath();c.arc(x+(y/18%2?9:0),y+9,2,0,6.3);c.fill()}}},
{id:'cake',w:46,h:165,seed:17,edge:'#c2527c',juice:['#ff9ec7','#ffffff','#ffd1e0'],
 f:u=>u<.4?.45+.55*Math.sin(u/.4*Math.PI/2):1-.3*((u-.4)/.6),
 paint(c,sh,r){const{w,h}=sh;for(let x=-w,i=0;x<w;x+=11,i++){c.fillStyle=i%2?'#ffd3e2':'#ff7aa8';c.fillRect(x,0,11,h)}
  c.fillStyle=lin(c,0,0,0,.45*h,['#fff4f8','#ffb6d0']);c.beginPath();c.moveTo(-w,0);c.lineTo(w,0);c.lineTo(w,.4*h);
  for(let x=w;x>=-w;x-=2)c.lineTo(x,.4*h+Math.abs(Math.sin(x*.12))*9);c.closePath();c.fill();
  c.strokeStyle='#ff8db4';c.lineWidth=3;c.lineCap='round';for(let i=0;i<3;i++){c.beginPath();c.arc(0,.1*h+i*.1*h,w*.7-i*6,.2,Math.PI-.2);c.stroke()}
  const cols=['#7ae0ff','#ffe066','#9be564','#fff'];for(let i=0;i<8;i++){c.save();c.translate((r()-.5)*w*1.6,r()*.32*h);c.rotate(r()*3);c.fillStyle=cols[i%4];c.fillRect(-3,-1,6,2.4);c.restore()}}},
{id:'pop',w:40,h:175,seed:19,edge:'#2b2d8f',juice:['#4cc9f0','#f72585','#fff'],
 f:u=>{const t=u<.14?.25+.75*Math.sqrt(Math.max(0,1-((.14-u)/.14)**2)):1;return u>.94?t-(u-.94)/.06*.14:t},
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=lin(c,0,0,0,h,['#4cc9f0','#4361ee','#b5179e','#f72585']);c.fillRect(-w,0,2*w,h);
  c.fillStyle='rgba(255,255,255,.28)';c.fillRect(-w*.7,8,8,h-16);c.fillStyle='rgba(255,255,255,.5)';c.fillRect(-w*.7,h*.3,8,10);
  c.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<6;i++){c.beginPath();c.arc((r()-.5)*w*1.4,10+r()*(h-30),1.8,0,6.3);c.fill()}}},
{id:'vase',w:46,h:175,seed:21,edge:'#6b2d10',juice:['#e07b45','#ffd166','#a8431b'],
 f:u=>.5+.5*Math.sin(Math.PI*(.1+.8*Math.pow(u,.9))),
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=lin(c,-w,0,w,0,['#a8431b','#e8895a','#f4a678','#c4552a']);c.fillRect(-w,0,2*w,h);
  c.fillStyle='#3a1f12';c.fillRect(-w,.3*h,2*w,.035*h);c.fillRect(-w,.66*h,2*w,.035*h);
  c.beginPath();for(let x=-w,i=0;x<w;x+=12,i++){c.moveTo(x,.4*h);c.lineTo(x+6,.58*h);c.lineTo(x+12,.4*h)}c.fill();
  c.fillStyle='#ffd166';c.fillRect(-w,.12*h,2*w,.03*h);c.fillRect(-w,.82*h,2*w,.03*h)}},
{id:'heart',w:54,h:165,seed:23,edge:'#8d1030',juice:['#ff5d8f','#ff9ab8','#ffffff'],
 f:u=>u<.4?.45+.55*Math.sin(u/.4*Math.PI/2):Math.pow(Math.max(0,1-((u-.4)/.6)),1/1.3),
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=rad(c,-w*.3,h*.3,4,h*.9,['#ff8fab','#ff3d71','#b5173f']);c.fillRect(-w,0,2*w,h);
  gloss(c,-w*.45,h*.2,w*.2,h*.1,-.5,.45);c.fillStyle='#fff';starPath(c,w*.4,h*.32,6,4);c.fill()}},
{id:'trophy',w:50,h:185,seed:25,edge:'#8a5a00',juice:['#ffd24a','#fff3b0','#f5b301'],
 f:u=>u<.7?.2+.8*Math.pow(1-u/.7,.7):.2,
 paint(c,sh,r){const{w,h}=sh;c.fillStyle=lin(c,-w,0,w,0,['#a86a05','#ffe066','#f5b301','#9a6000']);c.fillRect(-w,0,2*w,h);
  c.fillStyle='rgba(255,243,176,.9)';c.fillRect(-w,0,2*w,.05*h);c.fillStyle='#fff3b0';starPath(c,0,.2*h,13,5);c.fill();
  c.fillStyle='rgba(255,255,255,.35)';c.fillRect(-w*.55,.08*h,6,.45*h);c.fillRect(-6,.7*h,3,.3*h)}}
];
/* ---------- six more shapes ---------- */
SHAPES.push(

function ground(c,pal,r){
  const bh=(H-GROUND)/pal.bands.length;
  pal.bands.forEach((col,i)=>{c.fillStyle=col;c.fillRect(0,GROUND+i*bh,W,bh+1)});
  for(let i=0;i<140;i++){c.fillStyle=r()<.5?'rgba(0,0,0,.13)':'rgba(255,255,255,.07)';c.beginPath();c.arc(r()*W,GROUND+6+r()*(H-GROUND-6),1+r()*2.4,0,6.3);c.fill()}
  c.fillStyle=pal.lip;c.fillRect(0,GROUND-3,W,6);
}
function sky(c,st,y1){c.fillStyle=lin(c,0,0,0,y1||GROUND,st);c.fillRect(0,0,W,GROUND)}
function blobs(c,r,n,y0,y1,col,s){c.fillStyle=col;for(let i=0;i<n;i++){const x=r()*W,y=y0+r()*(y1-y0),k=s*(.6+r()*.8);[[0,0,1],[.8,.2,.7],[-.8,.2,.7],[.3,-.4,.8]].forEach(([dx,dy,rr])=>{c.beginPath();c.arc(x+dx*k,y+dy*k,rr*k,0,6.3);c.fill()})}}
function stars(c,r,n,y1){for(let i=0;i<n;i++){c.fillStyle='rgba(255,255,255,'+(.3+r()*.7)+')';c.beginPath();c.arc(r()*W,r()*y1,.4+r()*1.4,0,6.3);c.fill()}}
function hills(c,col,base,amp,f,ph){c.fillStyle=col;c.beginPath();c.moveTo(0,GROUND);for(let x=0;x<=W;x+=6)c.lineTo(x,base+Math.sin(x*f+ph)*amp);c.lineTo(W,GROUND);c.closePath();c.fill()}

const remixCache={};
function getLevel(i){
  if(i<LEVELS.length)return LEVELS[i];
  if(remixCache[i])return remixCache[i];
  const r=rng(i*977+13),keys=Object.keys(TW),picked=[],n=i<LEVELS.length+8?2:3;
  for(let k=0;k<n;k++)picked.push(keys.splice(r()*keys.length|0,1)[0]);
  const k=i-LEVELS.length+1;
  const lv={n:'Remix '+k,shape:(r()*SHAPES.length)|0,scene:(r()*SCENES.length)|0,period:Math.max(1.25,1.8-k*.03),tol:Math.max(10.5,12-k*.08)};
  let xt=0;picked.forEach(p=>{Object.assign(lv,TW[p]);xt=Math.max(xt,TW[p].xTol||0)});delete lv.t;if(xt)lv.xTol=xt;
  lv.note='Remix: '+picked.map(p=>TW[p].t).join(' + ')+'.';remixCache[i]=lv;return lv;
}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type,v,f2){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d);g.gain.setValueAtTime(v||.1,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.02)}

/* ---------- blade ---------- */
const tri=p=>{p=p%2;if(p<0)p+=2;return p<1?p:2-p};
let bladeY0=0,bladeY1=0,stepY=0;
function stepBlade(dt){
  let rate=1/lv.period;if(lv.beat)rate*=1+.85*Math.sin(tPlay*2*Math.PI/1.7);if(lv.surge)rate*=1+.75*Math.sin(tPlay*3.1)*Math.sin(tPlay*1.3+1);phi+=dt*rate;
}
function bladeList(){
  const jit=lv.jitter?Math.sin(tPlay*14)*3+Math.sin(tPlay*23+1)*1.5:0;
  const Y=t=>bladeY0+t*(bladeY1-bladeY0)+jit;
  if(lv.twin){const ya=Y(tri(phi)),yb=Y(tri(phi*1.6+.5));return[{y:ya,hot:false},{y:yb,hot:false},{y:(ya+yb)/2,hot:true}]}
  const ph0=lv.imposter?[0,.7,1.35]:[0];const hot=lv.imposter?Math.floor(tPlay/1.7)%3:0;
  return ph0.map((o,i)=>{let t=tri(phi+o);
    if(lv.steps){t=Math.round(t*(lv.steps-1))/(lv.steps-1)}
    return{y:Y(t),hot:i===hot,warn:lv.imposter&&i!==hot&&((tPlay/1.7)%1)>.82&&((Math.floor(tPlay/1.7)+1)%3===i)}});
}
const curCutY=()=>{const b=bladeList().find(x=>x.hot);return b.y};

/* ---------- ambient drifting effects per world ---------- */
const amb=[];
function setAmb(i){amb.length=0;const a=SCENES[i].amb;if(!a)return;for(let k=0;k<30;k++)amb.push({x:Math.random()*W,y:Math.random()*GROUND,ph:Math.random()*6.3,s:.6+Math.random()*1.2,c:a.c[k%a.c.length],k:a.k})}
function updateAmb(dt){
  for(const p of amb){const k=p.k;
    if(k==='snow'){p.y+=(25+p.s*18)*dt;p.x+=Math.sin(time+p.ph)*10*dt}
    else if(k==='leaf'||k==='petal'){p.y+=(22+p.s*14)*dt;p.x+=(14+Math.sin(time*1.3+p.ph)*20)*dt;p.ph+=dt*2}
    else if(k==='bubble'||k==='ember'||k==='heart'){p.y-=(20+p.s*22)*dt;p.x+=Math.sin(time*1.5+p.ph)*12*dt}
    else if(k==='fly'){p.x+=Math.sin(time*.7+p.ph)*14*dt;p.y+=Math.cos(time*.9+p.ph*2)*10*dt}
    else if(k==='rain'){p.y+=330*dt;p.x-=40*dt}
    else if(k==='rect'){p.y+=(25+p.s*15)*dt;p.ph+=dt*3}
    else if(k==='dust'){p.x+=(30+p.s*25)*dt;p.y+=Math.sin(time+p.ph)*6*dt}
    if(p.y>GROUND)p.y-=GROUND;if(p.y<0)p.y+=GROUND;if(p.x>W)p.x-=W;if(p.x<0)p.x+=W}
}
function drawAmb(c){
  for(const p of amb){c.save();c.translate(p.x,p.y);c.fillStyle=p.c;const k=p.k,tw=.5+.5*Math.sin(time*2+p.ph);
    if(k==='snow'){c.globalAlpha=.85;c.beginPath();c.arc(0,0,1+p.s*1.2,0,6.3);c.fill()}
    else if(k==='leaf'||k==='petal'){c.globalAlpha=.9;c.rotate(p.ph);c.beginPath();c.ellipse(0,0,k==='leaf'?5:3.5,k==='leaf'?2.6:2,0,0,6.3);c.fill()}
    else if(k==='bubble'){c.globalAlpha=.6;c.strokeStyle=p.c;c.lineWidth=1;c.beginPath();c.arc(0,0,2+p.s*2.5,0,6.3);c.stroke()}
    else if(k==='ember'){c.globalAlpha=.4+.5*tw;c.beginPath();c.arc(0,0,1.2+p.s,0,6.3);c.fill()}
    else if(k==='heart'){c.globalAlpha=.55;heartPath(c,0,0,3+p.s*2);c.fill()}
    else if(k==='fly'){c.globalAlpha=.25+.75*tw;c.fillStyle=rad(c,0,0,0,9,[p.c,p.c+'00']);c.beginPath();c.arc(0,0,9,0,6.3);c.fill();c.fillStyle='#fff';c.globalAlpha=tw;c.beginPath();c.arc(0,0,1.2,0,6.3);c.fill()}
    else if(k==='rain'){c.globalAlpha=.35;c.strokeStyle=p.c;c.lineWidth=1;c.beginPath();c.moveTo(0,0);c.lineTo(-2,10);c.stroke()}
    else if(k==='rect'){c.globalAlpha=.85;c.rotate(p.ph);c.fillRect(-3,-1,6,2.2)}
    else if(k==='dust'){c.globalAlpha=.35;c.beginPath();c.arc(0,0,1+p.s,0,6.3);c.fill()}
    else if(k==='star'){c.globalAlpha=tw;starPath(c,0,0,1.5+p.s*1.6,4);c.fill()}
    c.restore()}
}

function burst(x,y,n,cols,o){o=o||{};for(let i=0;i<n;i++){const a=(o.up?-Math.PI/2:0)+(Math.random()-.5)*(o.up?2.4:6.3),sp=(o.sp||160)*(.3+Math.random());
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.lift||0),g:o.g||700,t:0,life:(o.life||.7)*(.6+Math.random()*.6),s:(o.s||3)*(.6+Math.random()),c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*12,k:o.k||'circle'})}}

/* ---------- cutting ---------- */
function tryCut(){
  if(st!=='play'||cutDone)return;
  ac();cutDone=true;cutY=curCutY();cutTheta=theta();swoosh();slash=.14;
  const L=TOP+sh.h+bob(),th=cutTheta,tipX=px-L*Math.sin(th),tipY=L*Math.cos(th),hp=tipY-cutY;
  const tn=Math.tan(th),sw=2*(sh.w+14)+Math.abs(hp*tn),xc=tipX+hp*tn/2,ox=xc-sw/2,oy=cutY-6;
  const spr=document.createElement('canvas');spr.width=Math.ceil(sw*S);spr.height=Math.ceil((hp+40)*S);
  const o=spr.getContext('2d');o.scale(S,S);o.translate(-ox,-oy);o.beginPath();o.rect(ox-2,cutY,sw+4,hp+40);o.clip();
  o.translate(px,0);o.rotate(th);o.translate(0,TOP+bob());drawShapeLocal(o,sh);
  pc={spr,sw,sh:hp+40,ox:ox-tipX,oy:oy-tipY,x:tipX,y:tipY,y0:tipY,h:hp,theta:th,vy:0,vx:0,rot:0,delay:.1,resolved:false,landed:false,tipX};
  burst(xc,cutY,26,sh.juice,{sp:200,s:3.2,life:.8});
  st='fall';
}
function resolve(){
  pc.resolved=true;pc.hx=holeXLive();pc.dn=holeDLive();
  const dx=Math.abs(pc.x-pc.hx),xt=lv.xTol||14;
  if(dx>xt){pc.out='miss';pc.floor=GROUND;pc.vx=(pc.x<pc.hx?-1:1)*85;pc.vy*=.4}
  else{pc.diff=pc.h-pc.dn;const ft=lv.tol*.6;pc.out=pc.diff>ft?'tall':pc.diff<-ft?'short':'ok';if(pc.out==='ok')pc.dn=pc.h;pc.floor=GROUND+pc.dn}
}
function land(){
  pc.landed=true;finished=false;shake=4;thud();
  burst(pc.x,GROUND,10,['#8a6a4a','#c9a27a'],{up:true,sp:120,s:2.2,life:.4});
  st='kick';kickT=0;
}
function holeEdges(){const u=clamp(1-pc.dn/sh.h-7/sh.h,0,1),hw=sh.w*sh.f(u);return[pc.hx-hw,pc.hx+hw]}
function finish(){
  if(finished)return;finished=true;st='result';resT=0;
  if(pc.out==='ok'){
    const ad=Math.abs(pc.diff),perfect=ad<=4;streak=perfect?streak+1:0;if(perfect)perfects++;
    const base=100+level*10,gain=perfect?base+50+streak*25:Math.round(base*(1-ad/lv.tol*.4)/5)*5;
    pts+=gain;msg={text:perfect?'Perfect goal!':'Goal!',color:perfect?'#ffd24a':'#fff',t:0};
    popup(GOALX-30,GROUND-80,'+'+gain,perfect?'#ffd24a':'#fff',22);
    const fx=SCENES[sceneIdx].fx;burst(GOALX+10,GROUND-30,perfect?50:28,fx.c,{up:true,sp:320,s:perfect?4.5:3.5,life:1.2,k:fx.g,g:600,lift:60});
    good(level,perfect);
    if(pts>best.pts||level+1>best.level){best={pts:Math.max(pts,best.pts),level:Math.max(level+1,best.level)};try{localStorage.setItem('cutscore.best',JSON.stringify(best))}catch(e){}}
  }else{
    streak=0;tries--;if(HUB)hubSend({type:'gh-life-lost',level:level+1});bad();
    msg={text:pc.out==='tall'?'Too tall':pc.out==='short'?'Too short':'Missed the hole',color:'#fff',t:0};
  }
  setHUD();
}
function updateBall(dt){
  if(!ball||!pc||!pc.landed)return;
  const e=holeEdges(),L=e[0],R=e[1],gy=GROUND-BR;
  if(ball.mode==='roll'){
    ball.x+=ball.vx*dt;ball.rot+=ball.vx*dt/BR;
    if(pc.out==='ok'){
      const inGap=ball.x>L-8&&ball.x<R+8;ball.y=gy-(inGap?5*Math.sin(Math.PI*clamp((ball.x-(L-8))/(R-L+16),0,1)):0);
      if(ball.x>=GOALX){ball.mode='net';goalT=0;finish()}
    }else if(pc.out==='tall'){
      if(ball.x+BR>=L){ball.x=L-BR;ball.vx=-ball.vx*.4;ball.vy=-170;ball.mode='bounce';finish()}
    }else if(ball.x>=L+4){ball.mode='drop';finish()}
  }else if(ball.mode==='bounce'){
    ball.x+=ball.vx*dt;ball.vx*=Math.pow(.5,dt*2);ball.vy+=1900*dt;ball.y+=ball.vy*dt;ball.rot+=ball.vx*dt/BR;
    if(ball.y>=gy){ball.y=gy;ball.vy=ball.vy>150?-ball.vy*.35:0}
  }else if(ball.mode==='drop'){
    ball.x=Math.min(ball.x+ball.vx*dt,R-BR);ball.vx*=Math.pow(.0005,dt);ball.vy+=1900*dt;ball.y+=ball.vy*dt;ball.rot+=ball.vx*dt/BR;
    const fl=(pc.out==='short'?GROUND+pc.dn-pc.h:GROUND+pc.dn)-BR;
    if(ball.y>=fl){ball.y=fl;ball.vy=ball.vy>150?-ball.vy*.3:0;ball.vx*=.5}
  }else if(ball.mode==='net'){
    ball.x=Math.min(ball.x+ball.vx*dt,GOALX+22);ball.vx*=Math.pow(.15,dt);ball.y=gy;ball.rot+=ball.vx*dt/BR;
  }
}

/* ---------- flow ---------- */
let tour=[],tourPos=0;
function initTour(){tour=[];for(let i=0;i<LM_COUNT;i++)tour.push(LM_START+i);for(let i=tour.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[tour[i],tour[j]]=[tour[j],tour[i]]}tourPos=0}
function nextScene(){if(!tour.length)initTour();const s=tour[tourPos%tour.length];tourPos++;return s}
function startGame(){
  if(HUB&&!hub.ready)return;
  ac();level=HUB?hub.level-1:0;lv=getLevel(level);pts=0;perfects=0;streak=0;if(!HUB)tries=3;initTour();sceneIdx=nextScene();setAmb(sceneIdx);tr=null;
  newAttempt();st='intro';$('card').hidden=true;setHUD();banner();
}
function nextLevel(){
  const from=sceneIdx;level++;lv=getLevel(level);if(!HUB)tries=3;newAttempt();
  tr={t:0,dur:.8,from,to:nextScene()};st='trans';whoosh();setHUD();banner();
}
function hubAdvance(){
  st='sync';
  new Promise(r=>{hub.pending=r;hubSend({type:'gh-level-complete',level:level+1})}).then(d=>{
    if(!d.ok){const bn=$('banner');bn.innerHTML='<div class="row"><b>NOT VERIFIED</b><em></em></div><p></p>';bn.querySelector('em').textContent=lv.n;bn.querySelector('p').textContent=d.message||'That level could not be verified. Play it again.';bn.classList.remove('show');void bn.offsetWidth;bn.classList.add('show');newAttempt();st='intro';dropT=0;return}
    hub.level=d.level;hub.lives=d.lives;hub.status=d.status;
    if(d.status==='cleared'){showVictory();return}
    nextLevel();
  });
}
function hubOnState(){
  if(st!=='menu'&&st!=='over')return;
  if(hub.status==='cleared')showVictory();else if(hub.lives<=0)showOver();else showMenu();
}
function showVictory(){
  st='over';const c=$('card');c.hidden=false;

  $('claimBtn').onclick=()=>hubSend({type:'gh-open-claim'});
  hubSend({type:'gh-open-claim'});
}
const SCENE_NAMES=['Stadium','Farm','Candy land','Space','Crystal cave','Rooftops','Jungle','Beach','Arctic','Desert','Love lane','Neon city','Volcano','Deep sea','Autumn park','Cherry blossom','Haunted hill','Arcade','Castle','Savanna','Cloud kingdom','Mushroom grove','Pirate cove','Rainy city'];
function retry(){
  const from=sceneIdx;const ns=nextScene();

  const bn=$('banner');bn.innerHTML='<div class="row"><b>TRY AGAIN</b><em></em></div><p></p>';
  bn.querySelector('em').textContent=SCENES[ns].country||SCENE_NAMES[ns];bn.querySelector('p').textContent='New place, new hole. '+tries+(tries===1?' try':' tries')+' left.';

}
function showOver(){
  st='over';const c=$('card');c.hidden=false;

    c.innerHTML='<div class="k">Out of lives</div><h2>Level '+(level+1)+' is waiting</h2><div class="tip">Buy 1 life to continue exactly here, or end the game and start again from level 1.</div><div class="btns"><button class="btn go solo" id="buyBtn" type="button">Continue options</button></div>';

  }

   '<div class="stats"><div>'+(level+1)+'<small>level</small></div><div>'+perfects+'<small>perfect</small></div><div>'+best.pts+'<small>best</small></div></div>'+

function showMenu(){

/* ---------- update ---------- */
function update(dt){
  time+=dt;tSw+=dt;updateAmb(dt);if(kickT>=0)kickT+=dt;if(goalT>=0)goalT+=dt;updateBall(dt);if(shake>0)shake=Math.max(0,shake-dt*30);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.t>p.life)parts.splice(i,1)}
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>1.1)pops.splice(i,1)}
  if(msg)msg.t+=dt;if(slash>0)slash=Math.max(0,slash-dt);
  if(st==='trans'){tr.t+=dt;if(tr.t>=tr.dur){sceneIdx=tr.to;setAmb(sceneIdx);tr=null;st='intro';dropT=0}}
  else if(st==='intro'){dropT+=dt;if(dropT>=.55){st='play';tPlay=0}}
  else if(st==='play'){tPlay+=dt;stepBlade(dt);if(lv.hurry&&tPlay>=lv.hurry)tryCut()}
  else if(st==='fall'&&pc){
    pc.delay-=dt;
    if(pc.delay<=0){
      pc.vy+=2400*dt;pc.y+=pc.vy*dt;
      if(!pc.resolved){pc.rot=-pc.theta*clamp((pc.y-pc.y0)/(GROUND-pc.y0),0,1);if(pc.y>=GROUND)resolve()}
      if(pc.resolved){
        if(pc.out==='miss'){pc.x+=pc.vx*dt;pc.rot+=Math.sign(pc.vx)*dt*5}
        else pc.x+=(pc.hx-pc.x)*Math.min(1,dt*16);
        if(pc.y>=pc.floor){pc.y=pc.floor;land()}
      }
    }
  }else if(st==='kick'){
    if(ball.mode==='idle'&&kickT>=.3){ball.mode='roll';ball.vx=300;swoosh();burst(BX,GROUND,8,['#ffffff','#d9e2ff'],{up:true,sp:90,s:2,life:.35})}
    if(kickT>4)finish();
  }else if(st==='result'){
    resT+=dt;
    if(pc.out==='ok'){if(resT>1.3){if(HUB)hubAdvance();else nextLevel()}}
    else{
      if(resT>.8)fade=Math.max(0,1-(resT-.8)/.3);
      if(resT>1.15){if(tries<=0)showOver();else retry()}
    }
  }
}
/* ---------- player, goal, ball ---------- */
const JERSEY=['#1d4ed8','#2f9e44','#ec4899','#7c3aed','#0ea5e9','#dc2626','#16a34a','#f97316','#38bdf8','#eab308','#e11d48','#ff2bd6'];
const SKIN=['#8d5a3b','#f1c27d','#c68642','#e0ac69','#5c3a21'],HAIR=['#1b1209','#3b2a1a','#d9a441','#111'];
const jerseyOf=i=>(SCENES[i]&&SCENES[i].kit)||(i<12?JERSEY[i]:'hsl('+((i*47)%360)+',68%,48%)');
function kickAngle(){if(kickT<0)return 0;const t=kickT;if(t<.22)return -.7*(t/.22);if(t<.3)return -.7+1.9*((t-.22)/.08);return Math.max(0,1.2*(1-(t-.3)/.5))}
function leg(c,a,x,sock,sk){c.save();c.translate(x,-34);c.rotate(a);c.fillStyle=sk;c.fillRect(-3.5,0,7,22);c.fillStyle=sock;c.fillRect(-3.8,16,7.6,12);c.fillStyle='#f5f5f5';c.beginPath();c.roundRect(-4.5,27,13,7,3);c.fill();c.restore()}
function drawPlayer(c,idx){
  const ang=kickAngle(),won=goalT>=0&&pc&&pc.out==='ok',jump=won?Math.abs(Math.sin(goalT*7))*10*clamp(1.4-goalT,0,1):0;
  const jc=jerseyOf(idx),sk=SKIN[idx%5],hr=HAIR[idx%4];c.save();c.translate(PX,GROUND-jump);
  leg(c,-ang*.35-.08,-4,jc,sk);leg(c,ang,4,jc,sk);
  c.fillStyle='#10192f';c.beginPath();c.roundRect(-11,-37,22,13,3);c.fill();
  c.fillStyle=jc;c.beginPath();c.roundRect(-11,-64,22,30,5);c.fill();
  c.fillStyle='rgba(255,255,255,.85)';c.font='700 11px Fredoka,sans-serif';c.textAlign='center';c.fillText('10',0,-44);
  c.save();c.translate(0,-60);c.rotate(won?-2.6:-ang*.6);c.fillStyle=jc;c.fillRect(-3.5,0,7,10);c.fillStyle=sk;c.fillRect(-3,9,6,12);c.restore();
  c.fillStyle=sk;c.beginPath();c.arc(0,-74,9,0,6.3);c.fill();c.fillStyle=hr;c.beginPath();c.arc(0,-76,9.2,Math.PI,0);c.fill();
  c.restore();
}
function drawGoal(c,idx){
  const gx=314,gh=58,rip=goalT>=0&&goalT<.6?Math.sin(goalT*34)*3*(1-goalT/.6):0;
  c.save();c.fillStyle='rgba(255,255,255,.14)';c.beginPath();c.moveTo(gx,GROUND);c.lineTo(gx,GROUND-gh);c.lineTo(gx+14+rip,GROUND-gh-12);c.lineTo(gx+40+rip,GROUND-gh-12);c.lineTo(gx+40+rip,GROUND-10);c.lineTo(gx+26,GROUND);c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=1;c.beginPath();
  for(let i=0;i<=6;i++){const t=i/6;c.moveTo(gx+14+rip+t*26,GROUND-gh-12);c.lineTo(gx+rip*.5+14+t*26,GROUND-10)}
  for(let j=0;j<=6;j++){const y=GROUND-gh-12+j*(gh+2)/6;c.moveTo(gx+14+rip,y);c.lineTo(gx+40+rip,y)}c.stroke();
  c.lineCap='round';c.lineWidth=4.5;c.strokeStyle='#fff';c.beginPath();c.moveTo(gx,GROUND);c.lineTo(gx,GROUND-gh);c.lineTo(gx+14+rip,GROUND-gh-12);c.lineTo(gx+40+rip,GROUND-gh-12);c.stroke();
  c.strokeStyle=jerseyOf(idx);c.setLineDash([7,7]);c.beginPath();c.moveTo(gx,GROUND);c.lineTo(gx,GROUND-gh);c.lineTo(gx+14+rip,GROUND-gh-12);c.lineTo(gx+40+rip,GROUND-gh-12);c.stroke();c.restore();
}
function drawBall(c,idx){
  if(!ball)return;const sk=(idx||0)%4;c.save();c.translate(ball.x,ball.y);c.rotate(ball.rot);
  c.fillStyle='rgba(0,0,0,.25)';c.save();c.rotate(-ball.rot);c.beginPath();c.ellipse(0,BR-1,BR*.9,2,0,0,6.3);c.fill();c.restore();
  const base=['#ffffff','#fff','#e8772e','#d4e157'][sk];c.fillStyle=base;c.beginPath();c.arc(0,0,BR,0,6.3);c.fill();
  c.save();c.beginPath();c.arc(0,0,BR,0,6.3);c.clip();
  if(sk===0){c.fillStyle='#1b1f2a';for(let i=0;i<5;i++){c.save();c.rotate(i*1.2566);c.beginPath();c.arc(0,-BR*.62,BR*.26,0,6.3);c.fill();c.restore()}c.beginPath();c.arc(0,0,BR*.28,0,6.3);c.fill()}
  else if(sk===1){['#ef476f','#ffd166','#06d6a0','#118ab2'].forEach((col,i)=>{c.fillStyle=col;c.fillRect(-BR+i*BR/2,-BR,BR/2,2*BR)});}
  else if(sk===2){c.strokeStyle='#3a1a08';c.lineWidth=1.3;c.beginPath();c.moveTo(-BR,0);c.lineTo(BR,0);c.moveTo(0,-BR);c.lineTo(0,BR);c.arc(-BR*1.1,0,BR*.9,-.9,.9);c.arc(BR*1.1,0,BR*.9,Math.PI-.9,Math.PI+.9);c.stroke()}
  else{c.strokeStyle='#fff';c.lineWidth=1.6;c.beginPath();c.arc(-BR*1.1,0,BR*.9,-1,1);c.moveTo(BR*.2,-BR);c.arc(BR*1.1,0,BR*.9,Math.PI-1,Math.PI+1);c.stroke()}
  c.restore();c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=1;c.beginPath();c.arc(0,0,BR,0,6.3);c.stroke();c.restore();
}
/* ---------- draw ---------- */
function drawHole(c,x,depth,fogA){
  const u0=1-depth/sh.h;c.save();c.translate(x,GROUND-u0*sh.h);shapePath(c,sh,u0,1);
  c.fillStyle=lin(c,0,u0*sh.h,0,sh.h,['#4a2c1b','#1d0f08']);c.fill();c.lineWidth=2;c.strokeStyle='rgba(0,0,0,.5)';c.stroke();c.restore();
  if(fogA>0){c.save();c.globalAlpha=fogA;const hw=sh.w*sh.f(u0)+8,cy=GROUND+depth/2;
    for(let i=0;i<9;i++){const px=x+(((i*37)%100)/100-.5)*hw*2,py=GROUND-2+((i*53)%100)/100*(depth+14);c.fillStyle=rad(c,px,py,2,26,['rgba(255,255,255,.95)','rgba(215,225,245,.85)','rgba(215,225,245,0)']);c.beginPath();c.arc(px,py,26,0,6.3);c.fill()}
    c.fillStyle='#4a5a85';c.font='700 18px Fredoka,sans-serif';c.textAlign='center';c.fillText('?',x,cy+6);c.restore()}
}
function drawRope(c,top){c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1.6;c.beginPath();c.moveTo(0,-14);c.lineTo(0,top);c.stroke()}
function drawHanging(c,off,clipAbove){
  c.save();if(clipAbove!=null){c.beginPath();c.rect(-20,-40,W+40,clipAbove+40);c.clip()}
  c.translate(px,0);c.rotate(theta());drawRope(c,TOP+off+bob());c.translate(0,TOP+off+bob());drawShapeLocal(c,sh);c.restore();
}
function drawBlades(c){
  const list=bladeList();const hidden=lv.blink&&(tPlay%1.3)>.7&&!list[0].warn;
  list.forEach(b=>{const a=hidden?0:1;
    c.save();c.setLineDash([6,5]);c.lineWidth=b.hot?1.8:1;c.strokeStyle=b.hot?'rgba(255,255,255,'+.95*a+')':'rgba(255,255,255,'+(b.warn?.7:.25)*a+')';
    c.beginPath();c.moveTo(14,b.y);c.lineTo(W-40,b.y);c.stroke();c.setLineDash([]);
    const ha=hidden?.3:1;c.globalAlpha=ha;if(b.hot){c.shadowColor='#ffa53a';c.shadowBlur=10}
    c.fillStyle=b.hot?lin(c,0,b.y-5,0,b.y+5,['#ffc05c','#f08a1a']):'#8a93b5';c.beginPath();c.moveTo(W-40,b.y);c.lineTo(W-30,b.y-5);c.lineTo(W-8,b.y-5);c.lineTo(W-8,b.y+5);c.lineTo(W-30,b.y+5);c.closePath();c.fill();c.restore()});
  if(lv.hint&&!lv.imposter){const ty=TOP+sh.h+bob()-holeDLive(),a=.55*lv.hint*(.7+.3*Math.sin(time*5));c.save();c.strokeStyle='rgba(255,210,90,'+a+')';c.fillStyle='rgba(255,210,90,'+a+')';c.lineWidth=2;
    c.beginPath();c.moveTo(14,ty);c.lineTo(34,ty);c.stroke();c.beginPath();c.moveTo(34,ty);c.lineTo(28,ty-4);c.lineTo(28,ty+4);c.closePath();c.fill();c.font='700 10px Nunito,sans-serif';c.fillText('cut here',14,ty-6);c.restore()}
}
function drawPart(c,p){
  c.save();c.globalAlpha=clamp(1-p.t/p.life,0,1);c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;
  if(p.k==='rect'){c.fillRect(-p.s,-p.s*.4,p.s*2,p.s*.8)}
  else if(p.k==='star'){starPath(c,0,0,p.s*1.6,5);c.fill()}
  else if(p.k==='diamond'){c.beginPath();c.moveTo(0,-p.s*1.6);c.lineTo(p.s,0);c.lineTo(0,p.s*1.6);c.lineTo(-p.s,0);c.closePath();c.fill()}
  else if(p.k==='heart'){heartPath(c,0,0,p.s*1.3);c.fill()}
  else{c.beginPath();c.arc(0,0,p.s,0,6.3);c.fill()}
  c.restore();
}
function drawText(c,t,x,y,size,color,a){c.save();c.globalAlpha=a;c.font='600 '+size+'px Fredoka,sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle='rgba(10,17,36,.65)';c.lineJoin='round';c.strokeText(t,x,y);c.fillStyle=color;c.fillText(t,x,y);c.restore()}
function drawPiece(c){
  if(!pc)return;c.save();c.globalAlpha=fade;c.translate(pc.x,pc.y);c.rotate(pc.rot);c.drawImage(pc.spr,pc.ox,pc.oy,pc.sw,pc.sh);c.restore();
}
function draw(){
  const c=ctx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.setTransform(S,0,0,S,0,0);
  if(shake>0)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(st==='trans'){
    c.drawImage(sceneCanvas(tr.from,S),0,0,W,H);
    c.save();c.beginPath();c.arc(180,GROUND,eo(tr.t/tr.dur)*700,0,6.3);c.clip();c.drawImage(sceneCanvas(tr.to,S),0,0,W,H);c.restore();
    c.save();c.beginPath();c.arc(180,GROUND,eo(tr.t/tr.dur)*700,0,6.3);c.lineWidth=5;c.strokeStyle='rgba(255,255,255,.7)';c.stroke();c.restore();
    drawGoal(c,tr.to);drawPlayer(c,tr.to);drawBall(c,tr.to);
    return;
  }
  c.drawImage(sceneCanvas(sceneIdx,S),0,0,W,H);
  const scn=SCENES[sceneIdx];if(scn.country&&st!=='menu'){drawText(c,scn.country.toUpperCase(),W/2,534,15,'#fff',.85);drawText(c,scn.place,W/2,550,11,'#fff',.8)}
  const fogA=lv.fog&&(st==='play'||st==='fall')&&!(pc&&pc.resolved)?clamp((tPlay-1)/.4,0,1):0;
  if(st==='intro'&&lv.fog){/* hole visible while the shape drops in */}
  c.save();c.globalAlpha=st==='intro'?clamp(dropT/.3,0,1):1;drawHole(c,holeX(),holeD(),fogA);c.restore();
  drawAmb(c);drawGoal(c,sceneIdx);drawPlayer(c,sceneIdx);
  if(!cutDone){const off=-(1-eo(dropT/.55))*(TOP+sh.h+60);drawHanging(c,st==='intro'?off:0,null)}
  else{c.save();c.globalAlpha=fade;drawHanging(c,0,cutY);c.restore()}
  if(st==='play')drawBlades(c);
  if(st==='play'&&lv.hurry){const f=clamp(1-tPlay/lv.hurry,0,1);c.fillStyle='rgba(255,255,255,.15)';c.fillRect(16,10,W-32,6);c.fillStyle=f>.35?'#4ade80':'#ff6b6b';c.fillRect(16,10,(W-32)*f,6)}
  if(slash>0){const p=1-slash/.14,x=W-30-p*(W-50);c.save();c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=3;c.shadowColor='#fff';c.shadowBlur=12;c.beginPath();c.moveTo(x,cutY);c.lineTo(W-30,cutY);c.stroke();c.restore()}
  drawPiece(c);drawBall(c,sceneIdx);
  parts.forEach(p=>drawPart(c,p));
  pops.forEach(p=>drawText(c,p.text,p.x,p.y-p.t*50,p.size,p.color,clamp(1.2-p.t,0,1)));
  if(msg)drawText(c,msg.text,180,200,msg.text.length>9?26:32,msg.color,clamp(msg.t*6,0,1)*(st==='result'&&msg.t>1?clamp(2-msg.t,0,1):1)*(fade));
  if(lv.fog&&st==='play'&&tPlay<1)drawText(c,'Remember the depth',180,200,20,'#fff',1-clamp((tPlay-.6)/.4,0,1));
}

/* ---------- loop + input ---------- */
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(frame)}
function press(e){if(e.target.closest('.card')||e.target.closest('.chip'))return;e.preventDefault();tryCut()}
$('cutBtn').addEventListener('pointerdown',press);
field.addEventListener('pointerdown',press);
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(st==='play')tryCut();else if(st==='menu'||st==='over'){const b=$('startBtn')||$('againBtn');if(b)b.click()}}});
$('snd').addEventListener('click',()=>{muted=!muted;$('snd').textContent=muted?'Sound off':'Sound on';$('snd').setAttribute('aria-pressed',muted)});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(field);
resize();setHUD();newAttempt();showMenu();
if(HUB){hubSend({type:'gh-ready'});$('tries').setAttribute('aria-label','Lives left')}
window.__cs={scene:i=>sceneCanvas(i,1),n:()=>SCENES.length,lmStart:LM_START,lmCount:LM_COUNT,get st(){return st},get level(){return level},get tries(){return tries},get pts(){return pts},cut:tryCut,
  jump(n){level=n-1;nextLevel()},target(){return TOP+sh.h-holeDLive()},blade:()=>curCutY(),get lv(){return lv}};
requestAnimationFrame(frame);
})();</script>
